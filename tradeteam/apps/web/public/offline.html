<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Offline · TradeTeam</title>
<style>
  :root{--bg:#f5f6fa;--card:#fff;--fg:#0f172a;--muted:#64748b;--accent:#4f46e5}
  @media (prefers-color-scheme:dark){:root{--bg:#0a0f1e;--card:#111a2e;--fg:#e8edf7;--muted:#8b9ab6;--accent:#7c83ff}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;padding:24px}
  .c{background:var(--card);border-radius:24px;padding:32px;max-width:380px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.08)}
  h1{font-size:22px;margin:16px 0 8px}p{color:var(--muted);line-height:1.5;margin:0 0 20px}
  button{background:var(--accent);color:#fff;border:0;border-radius:14px;height:48px;padding:0 24px;font-weight:600;font-size:15px}
</style>
</head>
<body>
  <div class="c">
    <img src="/icons/icon-192.png" width="64" height="64" alt="">
    <h1>You're offline</h1>
    <p>Live prices, trading and wallet operations need a connection and are disabled while offline. Your funds are safe.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
