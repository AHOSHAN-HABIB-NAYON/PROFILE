# nginx reverse proxy for TradeTeam (single Node.js process on 127.0.0.1:3000).
# - terminates TLS (HTTP/2), redirects HTTP → HTTPS
# - proxies WebSocket upgrades for /socket.io with long timeouts
# - forwards client IP (the app uses it for rate limiting, login history, admin IP allowlist)
# Obtain certificates with certbot:  certbot --nginx -d example.com

upstream tradeteam {
    server 127.0.0.1:3000;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 2m;
    # The app already compresses responses; keep proxy buffering for normal requests.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Real-time: WebSocket (and Socket.IO polling fallback). No buffering, long-lived.
    location /socket.io/ {
        proxy_pass http://tradeteam;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        tcp_nodelay on;
    }

    # Immutable build assets can be cached aggressively.
    location /_next/static/ {
        proxy_pass http://tradeteam;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://tradeteam;
        proxy_read_timeout 60s;
    }
}
