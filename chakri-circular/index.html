<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>চাকরি সার্কুলার</title>
<meta name="description" content="চাকরি সার্কুলার — সরকারি ও বেসরকারি চাকরি, ভর্তি, রেজাল্ট, নোটিশ ও স্কলারশিপের নির্ভরযোগ্য আপডেট।">
<meta name="theme-color" content="#0B8457">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout: desktop = screen index | live phone | spec panel; phone width = the app itself, full bleed. */
:root{
  --bg:#F3F7F5; --stage:#E9F0ED; --surface:#FFFFFF; --surface-2:#F0F5F3; --surface-3:#E6EEEA;
  --ink:#0F1F1A; --ink-2:#4B5E57; --ink-3:#83958E; --line:#E0E9E4; --line-2:#CFDCD6;
  --green:#0B8457; --green-2:#086B47; --green-soft:#E1F3EA; --on-green:#FFFFFF;
  --blue:#1D63D8; --blue-soft:#E5EEFD;
  --violet:#6B4BD6; --violet-soft:#EEEAFD;
  --orange:#DD7412; --orange-soft:#FDF0E2;
  --red:#D23B3B; --red-soft:#FDE9E9;
  --teal:#0E8A8A; --teal-soft:#DFF4F3;
  --gold:#A8740A; --gold-soft:#FBF3DC; --gold-line:#EBD393;
  --hero-a:#0B8457; --hero-b:#1D63D8;
  --shadow:0 1px 2px rgba(15,31,26,.05),0 4px 14px rgba(15,31,26,.06);
  --shadow-lg:0 10px 40px rgba(15,31,26,.16);
  --scrim:rgba(8,20,16,.45);
  --font:"Noto Sans Bengali","Hind Siliguri","Nirmala UI","Vrinda",system-ui,sans-serif;
  --display:"Baloo Da 2","Noto Sans Bengali","Nirmala UI",system-ui,sans-serif;
  --r-sm:10px; --r:14px; --r-lg:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A1311; --stage:#070E0C; --surface:#111C19; --surface-2:#172521; --surface-3:#1E2E29;
  --ink:#E7F0EC; --ink-2:#A3B5AE; --ink-3:#6F827B; --line:#20322C; --line-2:#2B403A;
  --green:#2FB982; --green-2:#46C993; --green-soft:#11342A; --on-green:#04140E;
  --blue:#629AF5; --blue-soft:#15294A; --violet:#9C85F2; --violet-soft:#241D45;
  --orange:#F0A052; --orange-soft:#3A2710; --red:#F07474; --red-soft:#3D1B1B;
  --teal:#3CC4C0; --teal-soft:#10312F; --gold:#E4B653; --gold-soft:#2E2510; --gold-line:#5A4718;
  --hero-a:#0E5E42; --hero-b:#173F86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0A1311; --stage:#070E0C; --surface:#111C19; --surface-2:#172521; --surface-3:#1E2E29;
  --ink:#E7F0EC; --ink-2:#A3B5AE; --ink-3:#6F827B; --line:#20322C; --line-2:#2B403A;
  --green:#2FB982; --green-2:#46C993; --green-soft:#11342A; --on-green:#04140E;
  --blue:#629AF5; --blue-soft:#15294A; --violet:#9C85F2; --violet-soft:#241D45;
  --orange:#F0A052; --orange-soft:#3A2710; --red:#F07474; --red-soft:#3D1B1B;
  --teal:#3CC4C0; --teal-soft:#10312F; --gold:#E4B653; --gold-soft:#2E2510; --gold-line:#5A4718;
  --hero-a:#0E5E42; --hero-b:#173F86;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); --shadow-lg:0 10px 40px rgba(0,0,0,.5);
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
svg.i{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
svg.i.fill{fill:currentColor}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Showcase shell ---------- */
.stage{display:grid;grid-template-columns:240px minmax(0,auto) minmax(0,320px);gap:28px;justify-content:center;align-items:start;padding:24px 16px;min-height:100%}
.index{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);overflow:auto;padding-right:4px}
.index .brandline{display:flex;gap:10px;align-items:center}
.index .brandline b{font-family:var(--display);font-size:20px;line-height:1.1;color:var(--ink)}
.index .brandline small{display:block;color:var(--ink-3);font-size:12px}
.mode{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px}
.mode button{padding:7px 0;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--ink-2)}
.mode button.on{background:var(--green);color:var(--on-green)}
.index h4{margin:6px 0 0;font-size:11.5px;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-transform:uppercase}
.index ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:1px}
.index li button{width:100%;text-align:left;padding:6px 10px;border-radius:8px;font-size:14px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.index li button:hover{background:var(--surface)}
.index li button.on{background:var(--surface);color:var(--green);font-weight:600;box-shadow:var(--shadow)}
.index li button span{color:var(--ink-3);font-size:12px}
.themebtn{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13.5px;color:var(--ink-2)}

.device{width:392px;height:min(830px,calc(100vh - 48px));border-radius:44px;padding:10px;background:#0c1512;box-shadow:var(--shadow-lg),inset 0 0 0 2px #2a3632;position:sticky;top:24px}
.screen{position:relative;width:100%;height:100%;border-radius:35px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column;isolation:isolate}
.statusbar{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:12.5px;font-weight:600;background:var(--surface);color:var(--ink)}
.statusbar .dots{display:flex;gap:5px;align-items:center}
.statusbar .dots i{display:block;width:16px;height:9px;border:1.5px solid currentColor;border-radius:3px;position:relative}
.statusbar .dots i::after{content:"";position:absolute;inset:1px;right:4px;background:currentColor;border-radius:1px}
.urlbar{flex:none;display:flex;align-items:center;gap:6px;margin:0 10px 6px;padding:5px 12px;border-radius:10px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urlbar svg{width:12px;height:12px}
.urlbar span{overflow:hidden;text-overflow:ellipsis}
.urlwrap{background:var(--surface);flex:none}

.spec{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 48px);overflow:auto}
.spec section{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.spec h3{margin:0 0 6px;font-size:14px}
.spec p,.spec li{font-size:13px;color:var(--ink-2);margin:0}
.spec ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.spec pre{margin:8px 0 0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:10px;padding:10px;overflow:auto;max-height:260px;color:var(--ink-2)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow code{font-size:11.5px;background:var(--surface-2);padding:2px 8px;border-radius:99px;color:var(--ink-2)}

@media (max-width:1180px){.stage{grid-template-columns:220px auto}.spec{display:none}}
@media (max-width:760px){
  body{background:var(--bg)}
  .stage{display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch;gap:0;padding:0;height:100%;min-height:0}
  .index{position:relative;top:0;flex:none;z-index:50;max-height:none;flex-direction:row;overflow-x:auto;padding:8px 16px;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);align-items:center}
  .index .brandline,.index h4,.themebtn{display:none}
  .index ul{flex-direction:row;gap:6px}
  .index li button{white-space:nowrap;padding:5px 10px;border:1px solid var(--line)}
  .index li button span{display:none}
  .mode{flex:none;width:150px}
  .device{width:100%;flex:1;min-height:0;height:auto;border-radius:0;padding:0;background:none;box-shadow:none;position:relative;top:0}
  .screen{border-radius:0}
  .statusbar{display:none}
}

/* ---------- App primitives ---------- */
.view{flex:1;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;position:relative;overscroll-behavior:contain}
.view.has-nav{padding-bottom:84px}
.pad{padding:0 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.spacer{flex:1}
.muted{color:var(--ink-2)}
.faint{color:var(--ink-3)}
.fade-in{animation:fade .28s ease both}
@keyframes fade{from{opacity:.001;transform:translateY(6px)}to{opacity:1;transform:none}}

.appbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.appbar h1{margin:0;font-size:17px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink);position:relative;transition:background .15s}
.ib:hover{background:var(--surface-2)}
.ib .dot{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--surface)}
.logo{display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.logo b{font-family:var(--display);font-size:19px;line-height:1;color:var(--green);font-weight:700}
.logo small{display:block;font-size:10.5px;color:var(--ink-3);line-height:1.2;margin-top:2px;font-family:system-ui,sans-serif;letter-spacing:.02em}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:12px;font-weight:600;font-size:15px;transition:transform .12s,background .15s,box-shadow .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--green);color:var(--on-green)}
.btn.primary:hover{background:var(--green-2)}
.btn.blue{background:var(--blue);color:#fff}
.btn.ghost{background:var(--surface);border:1.5px solid var(--line-2);color:var(--ink)}
.btn.soft{background:var(--green-soft);color:var(--green)}
.btn.danger{background:var(--red-soft);color:var(--red)}
.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;pointer-events:none}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:22px 16px 10px}
.sec-h h2{margin:0;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
.sec-h h2 small{font-weight:500;color:var(--ink-3);font-size:12px}
.sec-h a,.sec-h button{font-size:13.5px;color:var(--green);font-weight:600;display:flex;align-items:center;gap:2px}
.sec-h svg{width:16px;height:16px}

.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;line-height:1.7;white-space:nowrap}
.badge svg{width:12px;height:12px;stroke-width:2.4}
.b-green{background:var(--green-soft);color:var(--green)}
.b-blue{background:var(--blue-soft);color:var(--blue)}
.b-violet{background:var(--violet-soft);color:var(--violet)}
.b-orange{background:var(--orange-soft);color:var(--orange)}
.b-red{background:var(--red-soft);color:var(--red)}
.b-teal{background:var(--teal-soft);color:var(--teal)}
.b-gold{background:var(--gold-soft);color:var(--gold)}
.b-grey{background:var(--surface-2);color:var(--ink-2)}

/* Hero */
.hero{margin:12px 16px 0;border-radius:var(--r-lg);padding:20px 16px 16px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(135deg,var(--hero-a),var(--hero-b))}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:34px solid rgba(255,255,255,.07)}
.hero h2{margin:0;font-family:var(--display);font-size:26px;line-height:1.25;font-weight:700;text-wrap:balance;position:relative}
.hero p{margin:4px 0 14px;font-size:13.5px;opacity:.88;position:relative}
.searchbox{position:relative;display:flex;align-items:center;background:var(--surface);border-radius:14px;padding:5px 5px 5px 14px;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.12);color:var(--ink);z-index:1}
.searchbox input{flex:1;min-width:0;border:0;outline:0;background:none;font-size:14.5px;height:40px}
.searchbox input::placeholder{color:var(--ink-3)}
.searchbox .go{width:42px;height:40px;border-radius:11px;background:var(--green);color:var(--on-green);display:grid;place-items:center}
.searchbox.flat{box-shadow:none;border:1.5px solid var(--line-2)}
.searchbox.flat:focus-within{border-color:var(--green)}
.hero .stats{display:flex;gap:16px;margin-top:12px;font-size:12.5px;opacity:.92;position:relative}
.hero .stats b{font-weight:700}

/* Categories */
.catgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 6px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);transition:transform .15s,box-shadow .15s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center}
.cat .ic svg{width:22px;height:22px}
.cat span{font-size:13px;font-weight:600;text-align:center;line-height:1.3}
.ic.green{background:var(--green-soft);color:var(--green)}.ic.blue{background:var(--blue-soft);color:var(--blue)}.ic.violet{background:var(--violet-soft);color:var(--violet)}.ic.orange{background:var(--orange-soft);color:var(--orange)}.ic.red{background:var(--red-soft);color:var(--red)}.ic.teal{background:var(--teal-soft);color:var(--teal)}.ic.gold{background:var(--gold-soft);color:var(--gold)}

.catrow{display:flex;align-items:center;gap:14px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:border-color .15s}
.catrow:hover{border-color:var(--green)}
.catrow .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center}
.catrow b{display:block;font-size:15.5px}
.catrow small{color:var(--ink-3);font-size:12.5px}

/* Job card */
.feed{display:flex;flex-direction:column;gap:10px;padding:0 16px}
.job{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);transition:transform .15s,box-shadow .15s,border-color .15s;position:relative;text-align:left;width:100%}
.job:hover{box-shadow:var(--shadow);transform:translateY(-1px)}
.job .thumb{width:58px;height:58px;border-radius:12px;overflow:hidden;background:var(--surface-2)}
.job .thumb svg{width:100%;height:100%;display:block}
.job .body{min-width:0;display:flex;flex-direction:column;gap:4px}
.job .top{display:flex;gap:6px;flex-wrap:wrap}
.job h3{margin:0;font-size:14.5px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.job .meta{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:12px;color:var(--ink-3)}
.job .meta span{display:inline-flex;align-items:center;gap:3px}
.job .meta svg{width:13px;height:13px}
.job .dl{font-size:12px;font-weight:600;color:var(--green);display:inline-flex;align-items:center;gap:4px}
.job .dl.soon{color:var(--orange)}
.job .dl.over{color:var(--red)}
.job .dl svg{width:13px;height:13px}
.job .bm{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--ink-3);align-self:start}
.job .bm:hover{background:var(--surface-2);color:var(--ink)}
.job .bm.on{color:var(--green)}
.job .bm.on svg{fill:currentColor}
.job.promoted{border-color:color-mix(in srgb,var(--blue) 35%,var(--line))}
.job.premium{border-color:var(--gold-line);background:linear-gradient(180deg,var(--gold-soft),var(--surface) 70%)}
.promo-tag{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:3px}
.promo-tag svg{width:11px;height:11px}

/* Chips / tabs */
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13.5px;display:inline-flex;align-items:center;gap:6px;color:var(--ink-2);transition:all .15s}
.chip.on{background:var(--green);border-color:var(--green);color:var(--on-green)}
.chip svg{width:15px;height:15px}
.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:4px;margin:0 16px}
.tabs button{height:36px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);transition:all .2s}
.tabs button.on{background:var(--surface);color:var(--green);box-shadow:var(--shadow)}

/* Bottom nav */
.bnav{position:absolute;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(8px + env(safe-area-inset-bottom,0px))}
.bnav button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--ink-3);padding:4px 0;font-weight:500}
.bnav .pill{width:52px;height:30px;border-radius:99px;display:grid;place-items:center;transition:background .25s,transform .25s}
.bnav button.on{color:var(--green);font-weight:700}
.bnav button.on .pill{background:var(--green-soft);animation:pop .3s ease}
@keyframes pop{0%{transform:scale(.7)}60%{transform:scale(1.08)}100%{transform:scale(1)}}

/* Sheets, drawer, modal, toast */
.scrim{position:absolute;inset:0;background:var(--scrim);z-index:60;animation:fadeo .2s ease both}
@keyframes fadeo{from{opacity:0}to{opacity:1}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.8,.2,1) both;max-height:88%;overflow:auto}
.sheet .grab{width:40px;height:4px;border-radius:4px;background:var(--line-2);margin:0 auto 12px}
.sheet h3{margin:0 0 12px;font-size:16px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.drawer{position:absolute;top:0;bottom:0;left:0;width:84%;max-width:320px;z-index:61;background:var(--surface);display:flex;flex-direction:column;animation:slide .28s cubic-bezier(.2,.8,.2,1) both;overflow:auto}
@keyframes slide{from{transform:translateX(-100%)}to{transform:none}}
.drawer .dh{display:flex;align-items:center;gap:10px;padding:16px;border-bottom:1px solid var(--line)}
.drawer nav{display:flex;flex-direction:column;padding:8px}
.drawer nav button{display:flex;align-items:center;gap:14px;padding:11px 12px;border-radius:12px;font-size:15px;text-align:left;color:var(--ink)}
.drawer nav button:hover{background:var(--surface-2)}
.drawer nav button.on{background:var(--green-soft);color:var(--green);font-weight:600}
.drawer nav button svg{color:var(--ink-2)}
.drawer nav button.on svg{color:var(--green)}
.drawer nav hr{border:0;border-top:1px solid var(--line);margin:6px 8px}
.switch{width:44px;height:26px;border-radius:99px;background:var(--line-2);position:relative;transition:background .2s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(18px)}
.socials{display:flex;gap:10px}
.socials button,.socials a{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface-2);color:var(--ink-2)}
.socials svg{width:18px;height:18px}
.modal{position:absolute;left:20px;right:20px;top:50%;transform:translateY(-50%);z-index:61;background:var(--surface);border-radius:24px;padding:24px 20px 18px;text-align:center;animation:zoom .25s ease both;box-shadow:var(--shadow-lg)}
@keyframes zoom{from{opacity:0;transform:translateY(-46%) scale(.95)}to{opacity:1;transform:translateY(-50%)}}
.modal h3{margin:12px 0 6px;font-size:18px;line-height:1.4;text-wrap:balance}
.modal p{margin:0 0 18px;color:var(--ink-2);font-size:14px}
.toast{position:absolute;left:50%;bottom:96px;transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:500;box-shadow:var(--shadow-lg);animation:fade .25s ease both;white-space:nowrap;display:flex;align-items:center;gap:8px}
.toast svg{width:16px;height:16px;color:var(--green-2)}

/* Detail */
.dhead{padding:16px;background:var(--surface);border-bottom:1px solid var(--line)}
.dhead .row{align-items:flex-start;gap:14px}
.dhead .thumb{width:68px;height:68px;border-radius:16px;overflow:hidden;flex:none}
.dhead h2{margin:0 0 4px;font-size:19px;line-height:1.4;text-wrap:balance}
.dhead .org{font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:5px}
.dhead .org svg{width:15px;height:15px;color:var(--green)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:16px}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start;min-width:0}
.fact .ic{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}
.fact .ic svg{width:17px;height:17px}
.fact small{display:block;font-size:11.5px;color:var(--ink-3);line-height:1.3}
.fact b{display:block;font-size:13.5px;font-weight:600;line-height:1.4}
.countdown{margin:0 16px;border-radius:var(--r-lg);padding:14px 16px;text-align:center;background:var(--red-soft);border:1px solid color-mix(in srgb,var(--red) 25%,transparent)}
.countdown small{font-size:13px;color:var(--red);font-weight:600}
.cd{display:flex;justify-content:center;gap:8px;margin-top:6px}
.cd div{min-width:62px;background:var(--surface);border-radius:12px;padding:6px 4px}
.cd b{display:block;font-size:24px;line-height:1.2;color:var(--red);font-weight:700}
.cd span{font-size:11.5px;color:var(--ink-2)}
.countdown.ok{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 25%,transparent)}
.countdown.ok small,.countdown.ok .cd b{color:var(--green)}
.countdown.over{background:var(--surface-2);border-color:var(--line)}
.countdown.over small{color:var(--ink-2)}
.countdown .ended{font-size:22px;font-weight:700;color:var(--ink-2)}
.ctas{display:grid;grid-template-columns:1fr auto;gap:10px;padding:14px 16px 0}
.prose{padding:6px 16px 0}
.prose h3{font-size:16px;margin:18px 0 6px;display:flex;align-items:center;gap:8px}
.prose h3::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--green)}
.prose p,.prose li{font-size:14.5px;color:var(--ink-2);margin:0 0 6px}
.prose ul,.prose ol{padding-left:20px;margin:0}
.note{background:var(--blue-soft);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;margin-top:10px}
.note svg{color:var(--blue);margin-top:2px}
.sharegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sharegrid button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);padding:8px 0;border-radius:12px}
.sharegrid button:hover{background:var(--surface-2)}
.sharegrid .ic{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:#fff}
.sharegrid .ic svg{width:22px;height:22px}
.shareprev{display:flex;gap:12px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.shareprev .thumb{width:52px;height:52px;border-radius:10px;overflow:hidden;flex:none}
.shareprev b{font-size:14px;line-height:1.4;display:block}
.shareprev small{color:var(--ink-3);font-size:12px}

/* Trending */
.rank{display:grid;grid-template-columns:34px 56px minmax(0,1fr);gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-align:left;width:100%}
.rank .n{font-family:var(--display);font-size:24px;font-weight:800;color:var(--ink-3);text-align:center;line-height:1}
.rank:nth-child(1) .n{color:var(--orange)}.rank:nth-child(2) .n{color:var(--blue)}.rank:nth-child(3) .n{color:var(--green)}
.rank .thumb{width:56px;height:56px;border-radius:12px;overflow:hidden}
.rank h3{margin:0 0 4px;font-size:14px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rank .meta{display:flex;gap:12px;font-size:12px;color:var(--ink-3)}
.rank .meta span{display:inline-flex;gap:3px;align-items:center}
.rank .meta svg{width:13px;height:13px}
.bar{height:4px;border-radius:4px;background:var(--surface-3);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--orange);border-radius:4px}

/* Search */
.filters{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;padding:0 16px}
.sel{position:relative}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:40px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:0 30px 0 12px;font-size:13.5px;color:var(--ink)}
.sel svg{position:absolute;right:10px;top:12px;width:16px;height:16px;color:var(--ink-3);pointer-events:none}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin:0 16px;overflow:hidden}
.list button,.list .li{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;text-align:left;font-size:14.5px;border-bottom:1px solid var(--line)}
.list > :last-child{border-bottom:0}
.list button:hover{background:var(--surface-2)}
.list .n{width:24px;height:24px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;font-size:12.5px;font-weight:700;color:var(--ink-2);flex:none}
.list .li svg,.list button svg{color:var(--ink-3)}
.empty{text-align:center;padding:36px 24px;color:var(--ink-2)}
.empty svg{width:40px;height:40px;color:var(--ink-3)}

/* Notice */
.notice{display:flex;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:flex-start;text-align:left;width:100%}
.notice .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.notice b{display:block;font-size:14.5px;line-height:1.45;font-weight:600}
.notice .meta{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--ink-3);margin-top:4px}
.notice .meta span{display:inline-flex;gap:3px;align-items:center}
.notice .meta svg{width:13px;height:13px}
.notice.old{opacity:.75}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13.5px;font-weight:600;color:var(--ink)}
.field label i{color:var(--red);font-style:normal}
.input,.textarea{width:100%;border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:0 14px;height:46px;font-size:14.5px;outline:0;transition:border-color .15s}
.textarea{height:auto;min-height:110px;padding:12px 14px;resize:vertical;line-height:1.6}
.input:focus,.textarea:focus,.sel select:focus{border-color:var(--green)}
.hint{font-size:12px;color:var(--ink-3)}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.seg{display:flex;flex-wrap:wrap;gap:8px}

/* Saved */
.saved{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:center}
.saved .thumb{width:52px;height:52px;border-radius:12px;overflow:hidden}
.saved h3{margin:0;font-size:14px;line-height:1.45;font-weight:600;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.saved .foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink-2)}

/* Footer blocks */
.subcard{margin:22px 16px 0;padding:18px 16px;border-radius:var(--r-lg);background:var(--blue-soft);display:flex;flex-direction:column;gap:10px}
.subcard h3{margin:0;font-size:16.5px;line-height:1.4;display:flex;gap:10px;align-items:center}
.subcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.subcard .row{gap:8px}
.subcard .input{height:44px;flex:1;min-width:0}
.pwa{margin:14px 16px 0;padding:16px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--surface);display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;align-items:center}
.pwa .appicon{width:56px;height:56px;border-radius:15px;background:linear-gradient(135deg,var(--green),var(--blue));display:grid;place-items:center}
.pwa h3{margin:0;font-size:15px;line-height:1.4}
.pwa p{margin:2px 0 0;font-size:12.5px;color:var(--ink-2)}
.pwa .btn{grid-column:1/-1}
.footer{margin-top:22px;padding:22px 16px 20px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:16px}
.footer p{margin:0;font-size:13.5px;color:var(--ink-2)}
.footer .links{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:13.5px}
.footer .links button{text-align:left;color:var(--ink-2)}
.footer .links button:hover{color:var(--green)}
.footer h4{margin:0 0 8px;font-size:13px;color:var(--ink-3);font-weight:600}
.team{display:flex;gap:10px;overflow-x:auto}
.member{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 6px 6px;border-radius:99px;background:var(--surface-2);font-size:12.5px}
.member small{display:block;color:var(--ink-3);font-size:11px;line-height:1.2}
.member b{font-weight:600;line-height:1.2;display:block}
.avatar{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.copy{font-size:12px;color:var(--ink-3);text-align:center;padding-top:14px;border-top:1px solid var(--line)}

/* State screens */
.state{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:40px 28px;gap:10px}
.state .big{font-family:var(--display);font-size:96px;line-height:1;font-weight:800;background:linear-gradient(135deg,var(--green),var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.state h2{margin:4px 0 0;font-size:20px;text-wrap:balance}
.state p{margin:0 0 12px;color:var(--ink-2);font-size:14.5px;max-width:30ch}
.state .acts{display:flex;flex-direction:column;gap:10px;width:100%;max-width:260px}
.adminpeek{position:absolute;top:0;left:0;right:0;z-index:5;background:var(--gold-soft);color:var(--gold);font-size:12.5px;padding:8px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--gold-line)}
.adminpeek button{margin-left:auto;font-weight:700;text-decoration:underline}

/* ---------- Admin ---------- */
.admin .appbar{background:var(--surface)}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kpi .row{gap:8px}
.kpi .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center}
.kpi .ic svg{width:16px;height:16px}
.kpi small{font-size:12.5px;color:var(--ink-2)}
.kpi b{font-size:22px;font-weight:700;line-height:1.3}
.kpi em{font-style:normal;font-size:12px;font-weight:600}
.up{color:var(--green)}.down{color:var(--red)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:0 16px}
.panel h3{margin:0;font-size:15px}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font-size:10px;font-family:var(--font)}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .t{height:8px;border-radius:6px;background:var(--surface-3);overflow:hidden}
.hbar .t i{display:block;height:100%;border-radius:6px;background:var(--green)}
.hbar b{text-align:right;font-weight:600;font-size:12.5px}
.arow{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);align-items:start}
.arow .thumb{width:52px;height:52px;border-radius:12px;overflow:hidden}
.arow h3{margin:0;font-size:14px;line-height:1.45;font-weight:600}
.arow .meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--ink-3);margin-top:4px;align-items:center}
.arow .meta span{display:inline-flex;gap:3px;align-items:center}
.arow .meta svg{width:13px;height:13px}
.arow .acts{display:flex;flex-direction:column;gap:4px}
.arow .acts .ib{width:34px;height:34px;border-radius:10px;color:var(--ink-2)}
.arow .acts .ib svg{width:17px;height:17px}
.fab{position:absolute;right:16px;bottom:22px;z-index:25;height:52px;padding:0 20px;border-radius:16px;background:var(--green);color:var(--on-green);font-weight:700;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px color-mix(in srgb,var(--green) 40%,transparent)}
.pipeline{display:flex;flex-direction:column;gap:0}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;position:relative;font-size:14px}
.step .dotc{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line-2);background:var(--surface);z-index:1;font-size:11px;font-weight:700;color:var(--ink-3)}
.step:not(:last-child)::before{content:"";position:absolute;left:11px;top:30px;bottom:-10px;width:2px;background:var(--line)}
.step.done .dotc{background:var(--green);border-color:var(--green);color:var(--on-green)}
.step.run .dotc{border-color:var(--blue);color:var(--blue);animation:pulse 1.2s infinite}
.step.done:not(:last-child)::before{background:var(--green)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--blue) 45%,transparent)}100%{box-shadow:0 0 0 9px transparent}}
.step small{font-size:12px;color:var(--ink-3)}
.logs{font:12px/1.65 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--surface-2);border-radius:12px;padding:10px 12px;max-height:200px;overflow:auto;color:var(--ink-2)}
.logs div{display:flex;gap:8px}
.logs time{color:var(--ink-3);flex:none}
.logs .ok{color:var(--green)}.logs .warn{color:var(--orange)}.logs .err{color:var(--red)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--surface-2);border-radius:10px;padding:8px 10px}
.kv small{display:block;font-size:11.5px;color:var(--ink-3)}
.kv b{font-size:15px}
.gapsel{display:flex;gap:6px;flex-wrap:wrap}
.gapsel button{min-width:48px;height:38px;padding:0 12px;border-radius:10px;border:1.5px solid var(--line-2);font-weight:600;background:var(--surface)}
.gapsel button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.preview{display:flex;flex-direction:column;gap:4px;counter-reset:p}
.preview div{display:flex;align-items:center;gap:8px;font-size:13px;padding:6px 10px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);min-width:0}
.preview div span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.preview div.p{background:var(--blue-soft);color:var(--blue);font-weight:600}
.preview div.pp{background:var(--gold-soft);color:var(--gold);font-weight:600}
.preview em{font-style:normal;font-size:11.5px;color:var(--ink-3);flex:none;width:44px}
.perm{display:flex;flex-wrap:wrap;gap:6px}
.perm button{height:30px;padding:0 10px;border-radius:99px;font-size:12.5px;border:1px solid var(--line-2);color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.perm button.on{background:var(--green-soft);border-color:transparent;color:var(--green);font-weight:600}
.perm svg{width:13px;height:13px}
.settings-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:0 16px}
.settings-list button{display:flex;align-items:center;gap:10px;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;font-size:13.5px;font-weight:500;text-align:left}
.settings-list button.on{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.settings-list svg{width:18px;height:18px;color:var(--ink-2)}
.adrawer{background:var(--surface)}
.login{min-height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 22px;gap:16px}
.login .mark{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:8px}
.login .mark b{font-family:var(--display);font-size:28px;color:var(--green);line-height:1}
.login .mark small{font-size:13px;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.divider{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3)}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.rolebar{margin:10px 16px 0;padding:8px 12px;border-radius:12px;background:var(--surface-2);font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.rolebar select{border:0;background:none;font-weight:600;color:var(--ink);font-size:12.5px}
.editor-tabs{display:flex;gap:4px;padding:0 16px;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--surface)}
.editor-tabs button{padding:10px 12px;font-size:14px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;white-space:nowrap}
.editor-tabs button.on{color:var(--green);border-color:var(--green)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.upload{border:1.5px dashed var(--line-2);border-radius:12px;padding:14px;display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink-2)}
.upload .thumb{width:48px;height:48px;border-radius:10px;overflow:hidden;flex:none}
.serp{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface-2)}
.serp .u{font-size:12px;color:var(--ink-2)}
.serp .t{font-size:16px;color:var(--blue);line-height:1.35;margin:2px 0}
.serp .d{font-size:13px;color:var(--ink-2)}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="stage">
  <aside class="index" id="index"></aside>
  <div class="device"><div class="screen" id="screen"></div></div>
  <aside class="spec" id="spec"></aside>
</div>
<script>
"use strict";
/* ================= Helpers ================= */
const BN = "০১২৩৪৫৬৭৮৯";
const bn = v => String(v).replace(/\d/g, d => BN[d]);
const bnInt = n => bn(Number(n).toLocaleString("en-IN"));
const MONTHS = ["জানুয়ারি","ফেব্রুয়ারি","মার্চ","এপ্রিল","মে","জুন","জুলাই","আগস্ট","সেপ্টেম্বর","অক্টোবর","নভেম্বর","ডিসেম্বর"];
const DAY = 864e5, HOUR = 36e5;
const NOW0 = Date.now();

const bnShort = t => { const d = new Date(t); return bn(d.getDate()) + " " + MONTHS[d.getMonth()].slice(0, 3); };

/* Promotion engine: interleave active promoted/premium posts after every `gap` normal posts */
function promoActive(p, t = Date.now()) { return !!(p.promo && p.promo.on && t >= p.promo.startAt && t <= p.promo.endAt && p.status === "published"); }
function buildFeed(list, gap = gapVal()) {
  const promos = list.filter(p => promoActive(p)).sort((a, b) => b.promo.priority - a.promo.priority || (a.promo.type === "premium" ? -1 : 1));
  const normal = list.filter(p => !promoActive(p));
  const shown = {}; const out = []; let pi = 0;
  normal.forEach((p, i) => {
    out.push({ p, promo: false });
    if ((i + 1) % gap === 0 && promos.length) {
      for (let k = 0; k < promos.length; k++) {
        const c = promos[(pi + k) % promos.length];
        if ((shown[c.id] || 0) < c.promo.max) { out.push({ p: c, promo: true }); shown[c.id] = (shown[c.id] || 0) + 1; pi = (pi + k + 1) % promos.length; break; }
      }
    }
  });
  // Short lists (search, filtered category) never reach a slot: still show matching promoted posts once, at the end
  promos.forEach(c => { if (!shown[c.id]) out.push({ p: c, promo: true }); });
  return out;
}

}

  const d = Math.floor(left / DAY), h = Math.floor(left % DAY / HOUR), m = Math.floor(left % HOUR / 6e4), s = Math.floor(left % 6e4 / 1e3);
  return `<div class="countdown ${d >= 4 ? "ok" : ""}" role="timer"><small>আবেদনের সময় বাকি</small><div class="cd num">
    <div><b>${pad2(d)}</b><span>দিন</span></div><div><b>${pad2(h)}</b><span>ঘণ্টা</span></div><div><b>${pad2(m)}</b><span>মিনিট</span></div><div><b>${pad2(s)}</b><span>সেকেন্ড</span></div></div></div>`;
}

function areaChart(data, labels, color = "var(--green)", h = 120) {
  const w = 320, pl = 30, pr = 8, pt = 10, pb = 20, max = Math.ceil(Math.max(...data) / 1000) * 1000;
  const x = i => pl + i * (w - pl - pr) / (data.length - 1), y = v => pt + (1 - v / max) * (h - pt - pb);
  const line = data.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
  const ticks = [0, max / 2, max];
  return `<div class="chart"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="চার্ট">
    ${ticks.map(t => `<line x1="${pl}" x2="${w - pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 6}" y="${y(t) + 3}" text-anchor="end">${bn(t >= 1000 ? t / 1000 + "k" : t)}</text>`).join("")}
    <path d="${line}L${x(data.length - 1)},${y(0)}L${x(0)},${y(0)}Z" fill="${color}" opacity=".12"/>
    <path d="${line}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="${x(data.length - 1)}" cy="${y(data[data.length - 1])}" r="4" fill="${color}" stroke="var(--surface)" stroke-width="2"/>
    ${labels.map((l, i) => `<text x="${x(i)}" y="${h - 4}" text-anchor="middle">${l}</text>`).join("")}</svg></div>`;
}

function pipeHTML() { const a = S.auto; return PIPE.map(([bnl, en], i) => `<div class="step ${i < a.step || (!a.running && a.step >= PIPE.length) ? "done" : i === a.step && a.running ? "run" : ""}"><span class="dotc">${i < a.step || (!a.running && a.step >= PIPE.length) ? "✓" : bn(i + 1)}</span><span>${bnl} <small>${en}</small></span>${i === 5 ? `<span class="badge b-orange">ম্যানুয়াল</span>` : "<span></span>"}</div>`).join(""); }
function autoKV() { const a = S.auto; return [["প্রসেস করা পোস্ট", bnInt(a.processed)], ["নতুন ড্রাফট", bnInt(a.fresh)], ["ডুপ্লিকেট বাদ", bnInt(a.dup)], ["AI টোকেন (এই মাস)", bnInt(a.tokens)], ["আনুমানিক খরচ", "$" + bn((a.tokens / 1e6 * 0.6).toFixed(2))], ["ত্রুটি", bn(a.errors)], ["শেষ রান", ago(a.last)], ["পরবর্তী রান", a.on ? bn(22) + " মিনিট পর" : "বন্ধ"]].map(([l, v]) => `<div><small>${l}</small><b>${v}</b></div>`).join(""); }
function logsHTML() { return S.auto.logs.slice(-40).map(l => `<div><time>${l.t}</time><span class="${l.c}">${l.m}</span></div>`).join(""); }
function logLine(m, c = "") { const d = new Date(); S.auto.logs.push({ t: bn(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0")), m, c }); const el = document.getElementById("a-logs"); if (el) { el.innerHTML = logsHTML(); el.scrollTop = el.scrollHeight; } }
[["সোর্স স্ক্যান সম্পন্ন: ১২টি নতুন লিংক", "ok"], ["ডুপ্লিকেট পাওয়া গেছে: ৭টি বাদ", "warn"], ["OpenAI রিরাইট: ৫টি পোস্ট", ""], ["৫টি ড্রাফট সংরক্ষিত — রিভিউয়ের অপেক্ষায়", "ok"]].forEach(([m, c]) => S.auto.logs.push({ t: "", m, c }));
S.auto.logs.forEach((l, i) => { const d = new Date(S.auto.last + i * 9e3); l.t = bn(String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0")); });

let autoTimer = null;
function autoRun() {
  const a = S.auto; if (a.running) return;
  a.running = true; a.step = 0; logLine("ম্যানুয়াল রান শুরু", ""); refreshAuto();
  const msgs = [["৪টি সোর্স থেকে ১৮টি লিংক পাওয়া গেছে", "ok"], ["১১টি ডুপ্লিকেট বাদ দেওয়া হয়েছে", "warn"], ["৭টি পোস্ট OpenAI-তে পাঠানো হয়েছে (gpt-4o-mini)", ""], ["রিরাইট সম্পন্ন · ৯,৮৪০ টোকেন", "ok"], ["৭টি ড্রাফট সংরক্ষিত", "ok"], ["অ্যাডমিন রিভিউয়ের জন্য নোটিফিকেশন পাঠানো হয়েছে", "ok"]];
  autoTimer = setInterval(() => {
    if (!a.running) return;
    logLine(msgs[a.step][0], msgs[a.step][1]);
    a.step++;
    if (a.step === 2) { a.dup += 11; a.processed += 18; }
    if (a.step === 4) { a.tokens += 9840; }
    if (a.step === 5) { a.fresh += 7; }
    if (a.step >= PIPE.length) { a.running = false; a.last = Date.now(); clearInterval(autoTimer); logLine("রান শেষ · পরবর্তী রান ৩০ মিনিট পর", "ok"); }
    refreshAuto();
  }, 1300);
}
function refreshAuto() {
  const p = document.getElementById("a-pipe"); if (!p) return;
  p.innerHTML = pipeHTML(); document.getElementById("a-kv").innerHTML = autoKV();
  document.getElementById("a-task").textContent = S.auto.running ? "চলছে: " + PIPE[Math.min(S.auto.step, 5)][1] : "শেষ রান " + ago(S.auto.last);
  const b = document.querySelector('[data-act="autorun"]'); if (b) b.disabled = S.auto.running;
}

const SET_SECTIONS = [["site", "সাইটের তথ্য", "globe"], ["brand", "লোগো ও ফেভিকন", "image"], ["footer", "ফুটার ও সোশ্যাল", "link"], ["seo", "SEO", "search"], ["pwa", "PWA", "phone"], ["notify", "নোটিফিকেশন", "bell"], ["smtp", "SMTP ইমেইল", "mail"], ["ai", "অটোমেশন ও OpenAI", "bolt"], ["promo", "প্রমোশন", "star"], ["maint", "মেইনটেন্যান্স", "wrench"], ["security", "অ্যাডমিন পাথ", "lock"], ["geo", "Geo lookup", "pin"]];
ADM.settings = () => {
  const sec = S.params.sec || "site", st = S.settings;
  const tg = (key, label, hint = "") => `<div class="row card" style="padding:12px 14px;box-shadow:none"><div style="flex:1"><b style="font-size:14px;display:block">${label}</b>${hint ? `<span class="hint">${hint}</span>` : ""}</div><button class="switch ${st[key] ? "on" : ""}" data-stoggle="${key}" aria-label="${label}"></button></div>`;
  const inp = (id, label, val, key) => `<div class="field"><label for="${id}">${label}</label><input class="input" id="${id}" value="${esc(val)}" ${key ? `data-skey="${key}"` : ""}></div>`;
  const B = {
    site: inp("s-name", "সাইটের নাম", st.siteName, "siteName") + inp("s-tag", "ট্যাগলাইন", st.tagline, "tagline") + inp("s-mail", "যোগাযোগ ইমেইল", st.email, "email"),
    brand: `<div class="upload"><div style="width:48px">${logoMark(48)}</div><div style="flex:1">logo.svg<br><span class="hint">SVG বা PNG, স্বচ্ছ ব্যাকগ্রাউন্ড</span></div><button class="btn ghost sm">পরিবর্তন</button></div><div class="upload"><div style="width:32px">${logoMark(32)}</div><div style="flex:1">favicon.png<br><span class="hint">৫১২×৫১২</span></div><button class="btn ghost sm">পরিবর্তন</button></div>`,
    footer: inp("s-copy", "কপিরাইট টেক্সট", "© ২০২৬ চাকরি সার্কুলার") + inp("s-fb", "Facebook", "facebook.com/cakricircular") + inp("s-yt", "YouTube", "youtube.com/@cakricircular") + inp("s-tg", "Telegram", "t.me/cakricircular"),
    seo: inp("s-gv", "Google verification", "google-site-verification=•••••") + `<div class="list" style="margin:0">${["sitemap.xml স্বয়ংক্রিয়", "robots.txt", "Canonical URL", "Open Graph ও Twitter Card", "Organization, WebSite, JobPosting, NewsArticle, BreadcrumbList schema"].map(t => `<div class="li">${I("check")}<span>${t}</span></div>`).join("")}</div>`,
    pwa: inp("s-an", "অ্যাপের নাম", "চাকরি সার্কুলার") + inp("s-tc", "থিম কালার", "#0B8457") + `<p class="hint">manifest.json ও আইকন PWABuilder-এর জন্য প্রস্তুত।</p>`,
    notify: tg("push", "পুশ নোটিফিকেশন", "প্রথম ভিজিটে অনুমতি চাওয়া হবে") + inp("s-vapid", "VAPID public key", "BHx2••••••••"),
    smtp: inp("s-smtp", "SMTP হোস্ট", st.smtp, "smtp") + `<div class="grid2">${inp("s-port", "পোর্ট", "465")}${inp("s-su", "ইউজার", "no-reply@cakricircular.com")}</div><button class="btn ghost sm" data-act="toast" data-msg="টেস্ট ইমেইল পাঠানো হয়েছে">টেস্ট ইমেইল পাঠান</button>`,
    ai: inp("s-key", "OpenAI API Key", "sk-••••••••••••••••") + `<div class="grid2">${inp("s-model", "মডেল", "gpt-4o-mini")}${inp("s-limit", "দৈনিক সীমা", "৬০ পোস্ট")}</div>` + inp("s-cron", "Cron (ঐচ্ছিক)", "*/30 * * * *"),
    promo: `<div class="field"><label>প্রমোশন গ্যাপ</label><div class="gapsel">${[4, 5, 6].map(v => `<button class="${st.gap == v ? "on" : ""}" data-gap="${v}">${bn(v)}</button>`).join("")}<button class="${st.gap === "custom" ? "on" : ""}" data-gap="custom">কাস্টম</button></div></div><button class="btn soft sm" data-ago="promotions">প্রমোশন ম্যানেজ করুন${I("chev")}</button>`,
    maint: tg("maintenance", "মেইনটেন্যান্স মোড", "চালু থাকলে ভিজিটররা মেইনটেন্যান্স পেজ দেখবেন; অ্যাডমিন আসল সাইট দেখতে পারবেন") + `<div class="field"><label for="s-mm">বার্তা</label><textarea class="textarea" id="s-mm" data-skey="maintMsg">${esc(st.maintMsg)}</textarea></div><button class="btn soft sm" data-act="viewsite">পাবলিক সাইটে দেখুন${I("chev")}</button>`,
    security: inp("s-path", "অ্যাডমিন পাথ", st.adminPath, "adminPath") + `<p class="hint">ডিফল্ট /admin পাথ বন্ধ থাকবে। পরিবর্তনের পর নতুন লিংক বুকমার্ক করে রাখুন।</p>`,
    geo: tg("geo", "Geo lookup", "অ্যানালিটিক্সে জেলা/দেশভিত্তিক ট্রাফিক দেখায়")
  };
  return `${abar("সেটিংস")}<div class="view">
    <div class="settings-list" style="padding-top:14px">${SET_SECTIONS.map(([k, l, ic]) => `<button class="${sec === k ? "on" : ""}" data-sec="${k}">${I(ic)}${l}</button>`).join("")}</div>
    <div class="sec-h"><h2>${SET_SECTIONS.find(s => s[0] === sec)[1]}</h2></div>
    <div class="stack pad">${B[sec]}<button class="btn primary block" data-act="savesettings">সেভ করুন</button><p class="hint" style="text-align:center;margin:0">সেভ করার সঙ্গে সঙ্গে সাইটে পরিবর্তন দেখা যাবে</p></div>
    <div style="height:24px"></div></div>`;
};

ADM.profile = () => `${appbar("প্রোফাইল")}<div class="view"><div class="stack pad" style="padding-top:18px">
  <div class="row"><span class="avatar" style="width:60px;height:60px;font-size:24px;background:${me().color}">${me().name[0]}</span><div><b style="font-size:17px;display:block">${me().name}</b><span class="faint" style="font-size:13px">${me().email}</span></div></div>
  <div class="field"><label for="pf-name">নাম</label><input class="input" id="pf-name" value="${esc(me().name)}"></div>
  <div class="grid2"><div class="field"><label for="pf-p1">নতুন পাসওয়ার্ড</label><input class="input" type="password" id="pf-p1"></div><div class="field"><label for="pf-p2">নিশ্চিত করুন</label><input class="input" type="password" id="pf-p2"></div></div>
  <button class="btn primary" data-act="toast" data-msg="প্রোফাইল আপডেট হয়েছে">আপডেট করুন</button>
  <button class="btn danger" data-act="logout">${I("logout")}লগআউট</button></div></div>`;

function adrawerHTML() {
  return `<div class="scrim" data-act="close"></div><aside class="drawer adrawer" role="dialog" aria-label="অ্যাডমিন মেনু">
    <div class="dh"><span class="avatar" style="width:42px;height:42px;background:${me().color}">${me().name[0]}</span><div style="flex:1;min-width:0"><b style="display:block">${me().name}</b><span class="faint" style="font-size:12px">${me().role === "admin" ? "Admin" : "Moderator"}</span></div><button class="ib" data-act="close" aria-label="বন্ধ">${I("x")}</button></div>
    <nav>${MODULES.filter(([k]) => can(k)).map(([k, l, ic]) => `<button class="${S.screen === k ? "on" : ""}" data-ago="${k}">${I(ic)}${l}${k === "reports" ? `<span class="spacer"></span><span class="badge b-red num">${bn(REPORTS.filter(r => r.status === "new").length)}</span>` : ""}</button>`).join("")}
    <hr><button data-act="viewsite">${I("globe")}সাইট দেখুন</button><button data-act="theme">${I("moon")}ডার্ক মোড</button><button data-act="logout">${I("logout")}লগআউট</button></nav></aside>`;
}
</script>
<script>
/* ================= Router ================= */
const $screen = document.getElementById("screen");
let toastTimer = null;

function urlFor() {
  const p = S.params, base = "cakricircular.com";
  if (S.mode === "admin") return base + S.settings.adminPath + (S.loggedIn ? "/" + S.screen : "/login");
  const post = postById(p.id), cat = catOf(p.id);
  return base + ({
    home: "/", latest: "/সর্বশেষ", categories: "/ক্যাটাগরি", category: "/ক্যাটাগরি/" + (cat ? cat.slug : ""), search: "/খুঁজুন" + (p.q ? "?q=" + p.q : ""),
    trending: "/ট্রেন্ডিং", detail: "/চাকরি/" + (post ? post.slug : ""), notice: "/নোটিশ", report: "/রিপোর্ট", saved: "/সেভ-করা-চাকরি",
    about: "/আমাদের-সম্পর্কে", contact: "/যোগাযোগ", privacy: "/গোপনীয়তা-নীতি", terms: "/শর্তাবলী", notfound: "/পুরোনো-লিংক", maintenance: "/"
  }[S.screen] || "/");
}

function screenBody() {
  if (S.mode === "admin") {
    if (!S.loggedIn) return ADM.login();
    if (!can(S.screen)) return abar("অনুমতি নেই") + `<div class="view">${denied()}</div>`;
    return (ADM[S.screen] || ADM.dashboard)();
  }
  if (S.settings.maintenance && !S.peek && S.screen !== "maintenance") return PUB.maintenance();
  if (S.screen === "maintenance") return PUB.maintenance();
  return (PUB[S.screen] || PUB.notfound)();
}

function render(keepScroll) {
  const prev = $screen.querySelector(".view"), top = keepScroll && prev ? prev.scrollTop : 0;
  let ov = "";
  if (S.overlay) {
    const t = S.overlay.type;
    if (t === "drawer") ov = drawerHTML();
    if (t === "adrawer") ov = adrawerHTML();
    if (t === "share") ov = shareHTML(postById(S.overlay.id));
    if (t === "push") ov = pushHTML();
    if (t === "remind") ov = remindHTML(postById(S.overlay.id));
  }
  $screen.innerHTML = `<div class="statusbar num"><span>৯:৪১</span><span class="dots">${I("globe").replace('class="i ', 'style="width:14px;height:14px" class="i ')}<i></i></span></div>
    <div class="urlwrap"><div class="urlbar">${I("lock")}<span>${esc(urlFor())}</span></div></div>
    ${screenBody()}${ov}${S.toast ? `<div class="toast" role="status">${I("check")}${S.toast}</div>` : ""}`;
  const v = $screen.querySelector(".view"); if (v && top) { v.style.scrollBehavior = "auto"; v.scrollTop = top; v.style.scrollBehavior = ""; }
  if (S.mode === "public" && S.screen === "search") renderResults();
  if (S.mode === "admin" && S.screen === "automation") { const l = document.getElementById("a-logs"); if (l) l.scrollTop = l.scrollHeight; }
  renderIndex(); renderSpec();
}

function go(screen, params = {}, mode) {
  S.stack.push({ mode: S.mode, screen: S.screen, params: S.params });
  if (mode) S.mode = mode;
  S.screen = screen; S.params = params; S.overlay = null;
  try { history.pushState({ d: S.stack.length }, ""); pushed++; } catch (e) {}
  render();
}
function back() {
  if (S.overlay) { S.overlay = null; return render(true); }
  const prev = S.stack.pop();
  if (!prev) { S.screen = S.mode === "admin" ? "dashboard" : "home"; S.params = {}; return render(); }
  Object.assign(S, { mode: prev.mode, screen: prev.screen, params: prev.params });
  render();
}
let pushed = 0;
window.addEventListener("popstate", () => { if (pushed > 0) pushed--; back(); });
function toast(msg) { S.toast = msg; render(true); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; const t = $screen.querySelector(".toast"); if (t) t.remove(); }, 2200); }
function isDark() { const a = document.documentElement.getAttribute("data-theme"); return a ? a === "dark" : matchMedia("(prefers-color-scheme: dark)").matches; }
function toggleTheme() { const t = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", t); store.set("theme", t); render(true); }
function chime() { try { const c = new (window.AudioContext || window.webkitAudioContext)(); [880, 1320].forEach((f, i) => { const o = c.createOscillator(), g = c.createGain(); o.frequency.value = f; o.type = "sine"; g.gain.setValueAtTime(0.0001, c.currentTime + i * .14); g.gain.exponentialRampToValueAtTime(0.2, c.currentTime + i * .14 + .02); g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + i * .14 + .35); o.connect(g).connect(c.destination); o.start(c.currentTime + i * .14); o.stop(c.currentTime + i * .14 + .4); }); } catch (e) {} }
function addRecent(q) { q = q.trim(); if (!q) return; S.recent = [q, ...S.recent.filter(x => x !== q)].slice(0, 5); store.set("recent", S.recent); }

/* ================= Events ================= */
const SEL = "[data-act],[data-go],[data-ago],[data-q],[data-tab],[data-rtype],[data-pf],[data-etab],[data-status],[data-ptype],[data-gap],[data-corder],[data-ctoggle],[data-ntoggle],[data-ndel],[data-rf],[data-rset],[data-rdel],[data-ttoggle],[data-perm],[data-sec],[data-stoggle],[data-remday]";
$screen.addEventListener("click", e => {
  const el = e.target.closest(SEL); if (!el || el.disabled) return;
  const d = el.dataset, id = d.id ? +d.id : undefined;
  if (el.tagName === "BUTTON" && el.form && !el.type) {/* form buttons handled by submit */}
  if (d.go) { e.preventDefault(); return go(d.go, id !== undefined ? { id: d.go === "category" ? d.id : id } : {}); }
  if (d.ago) { e.preventDefault(); const p = {}; if (id) p.id = id; if (d.tab) p.tab = d.tab; if (d.pf) p.f = d.pf; return go(d.ago, p, "admin"); }
  if (d.q !== undefined) { const i = document.getElementById("search-q"); if (i) { i.value = d.q; addRecent(d.q); renderResults(); } return; }
  if (d.tab) { S.params.tab = d.tab; return render(true); }
  if (d.rtype) { el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); return; }
  if (d.pf) { S.params.f = d.pf; return render(true); }
  if (d.etab) { S.params.tab = d.etab; return render(); }
  if (d.status) { const p = postById(d.id); if (p) p.status = d.status; else el.parentElement.querySelectorAll(".chip").forEach(c => c.classList.toggle("on", c === el)); return p ? render(true) : null; }
  if (d.ptype) { const p = postById(d.id); if (!p) return toast("আগে পোস্টটি সেভ করুন"); if (d.ptype === "none") delete p.promo; else { p.promo = p.promo || { on: true, startAt: Date.now() - HOUR, endAt: Date.now() + 7 * DAY, priority: 1, max: 3 }; p.promo.type = d.ptype; } return render(true); }
  if (d.gap) { S.settings.gap = d.gap === "custom" ? "custom" : +d.gap; saveSettings(); return render(true); }
  if (d.corder !== undefined) { const i = +d.corder, j = i + +d.dir; if (j < 0 || j >= CATS.length) return; [CATS[i], CATS[j]] = [CATS[j], CATS[i]]; return render(true); }
  if (d.ctoggle !== undefined) { CATS[+d.ctoggle].on = !CATS[+d.ctoggle].on; return render(true); }
  if (d.ntoggle) { const n = NOTICES.find(x => x.id === +d.ntoggle); n.on = !n.on; return render(true); }
  if (d.ndel) { NOTICES = NOTICES.filter(x => x.id !== +d.ndel); return toast("নোটিশ মুছে ফেলা হয়েছে"); }
  if (d.rf) { S.params.f = d.rf; return render(true); }
  if (d.rset) { REPORTS.find(r => r.id === +d.rset).status = d.s; return toast(d.s === "resolved" ? "রিপোর্ট সমাধান হিসেবে চিহ্নিত" : "রিভিউ শুরু হয়েছে"); }
  if (d.rdel) { REPORTS = REPORTS.filter(r => r.id !== +d.rdel); return toast("রিপোর্ট মুছে ফেলা হয়েছে"); }
  if (d.ttoggle) { const t = TEAM.find(x => x.id === +d.ttoggle); t.on = !t.on; if (!t.on && S.me === t.id) S.me = 1; return render(true); }
  if (d.perm) { const t = TEAM.find(x => x.id === +d.uid); t.perms = t.perms.includes(d.perm) ? t.perms.filter(x => x !== d.perm) : [...t.perms, d.perm]; return render(true); }
  if (d.sec) { S.params.sec = d.sec; return render(true); }
  if (d.stoggle) { S.settings[d.stoggle] = !S.settings[d.stoggle]; saveSettings(); return render(true); }
  if (d.remday !== undefined) { const n = +d.remday; if (n) S.reminders[id] = n; else delete S.reminders[id]; store.set("rem", S.reminders); if (!n) S.overlay = null; return toast(n ? `শেষ তারিখের ${bn(n)} দিন আগে মনে করিয়ে দেব` : "রিমাইন্ডার বন্ধ করা হয়েছে"); }

  switch (d.act) {
    case "back": if (pushed > 0) { try { history.back(); return; } catch (err) {} } return back();
    case "drawer": S.overlay = { type: "drawer" }; return render(true);
    case "adrawer": S.overlay = { type: "adrawer" }; return render(true);
    case "close": S.overlay = null; return render(true);
    case "theme": return toggleTheme();
    case "share": S.overlay = { type: "share", id }; return render(true);
    case "save": { e.stopPropagation(); const on = S.saved.includes(id); S.saved = on ? S.saved.filter(x => x !== id) : [id, ...S.saved]; store.set("saved", S.saved); return toast(on ? "সেভ থেকে সরানো হয়েছে" : "চাকরিটি সেভ করা হয়েছে"); }
    case "remind": if (S.screen === "saved") { if (S.reminders[id]) delete S.reminders[id]; else S.reminders[id] = 3; store.set("rem", S.reminders); return toast(S.reminders[id] ? "শেষ তারিখের ৩ দিন আগে মনে করিয়ে দেব" : "রিমাইন্ডার বন্ধ"); } S.overlay = { type: "remind", id }; return render(true);
    case "copy-link": { const u = d.url; S.overlay = null; const done = () => toast("লিংক কপি হয়েছে"); try { navigator.clipboard.writeText(u).then(done, done); } catch (err) { done(); } return; }
    case "copy-email": { const done = () => toast("ইমেইল কপি হয়েছে"); try { navigator.clipboard.writeText(S.settings.email).then(done, done); } catch (err) { done(); } return; }
    case "toast": S.overlay = null; return toast(d.msg);
    case "pdf": return toast("PDF নতুন ট্যাবে খুলছে");
    case "install": return toast("হোম স্ক্রিনে যোগ করা হচ্ছে");
    case "unsub": S.subscribed = false; store.set("sub", false); return toast("আনসাবস্ক্রাইব করা হয়েছে");
    case "push-yes": S.pushAsked = true; store.set("push", true); S.overlay = null; return toast("নোটিফিকেশন চালু হয়েছে");
    case "push-no": S.pushAsked = true; store.set("push", true); S.overlay = null; return render(true);
    case "sound": S.noticeSound = !S.noticeSound; store.set("snd", S.noticeSound); if (S.noticeSound) chime(); return render(true);
    case "clear-recent": S.recent = []; store.set("recent", []); return renderResults();
    case "retry": return toast("এখনো কাজ চলছে, একটু পরে চেষ্টা করুন");
    case "peek": S.peek = true; return render();
    case "glogin": S.loggedIn = true; store.set("login", true); S.screen = "dashboard"; return render();
    case "logout": S.loggedIn = false; store.set("login", false); S.overlay = null; S.stack = []; return render();
    case "viewsite": S.peek = false; return go("home", {}, "public");
    case "trash": { const p = postById(id); p.status = "trash"; return toast("পোস্ট ট্র্যাশে সরানো হয়েছে"); }
    case "savepost": toast(id ? "পোস্ট আপডেট হয়েছে" : "ড্রাফট সেভ হয়েছে"); return;
    case "ptoggle": { const p = postById(id); if (p && p.promo) p.promo.on = !p.promo.on; return render(true); }
    case "nexp": S.settings.noticeExpiry = !S.settings.noticeExpiry; saveSettings(); return render(true);
    case "ndelexp": NOTICES = NOTICES.filter(n => n.at + n.exp * DAY > Date.now()); return toast("মেয়াদোত্তীর্ণ নোটিশ মুছে ফেলা হয়েছে");
    case "addnotice": NOTICES.unshift({ id: Date.now(), title: "ডিসেম্বর মাসের নিয়োগ পরীক্ষার সমন্বিত সময়সূচি", at: Date.now(), exp: 10, icon: "megaphone", tone: "blue", on: true }); if (S.noticeSound) chime(); return toast("নতুন নোটিশ প্রকাশিত হয়েছে");
    case "adduser": return toast("আমন্ত্রণ ইমেইল পাঠানোর ফর্ম খুলছে");
    case "autotoggle": S.auto.on = !S.auto.on; logLine(S.auto.on ? "শিডিউলার চালু করা হয়েছে" : "শিডিউলার বন্ধ করা হয়েছে", S.auto.on ? "ok" : "warn"); return render(true);
    case "autorun": return autoRun();
    case "autostop": if (S.auto.running) { S.auto.running = false; clearInterval(autoTimer); logLine("রান মাঝপথে বন্ধ করা হয়েছে", "err"); } else { S.auto.on = false; logLine("শিডিউলার বন্ধ করা হয়েছে", "warn"); } return render(true);
    case "savesettings": saveSettings(); return toast("সেটিংস সেভ হয়েছে · সাইটে আপডেট হয়েছে");
  }
});
$screen.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.matches('[role="link"]')) e.target.click(); if (e.key === "Escape" && S.overlay && S.overlay.type !== "push") { S.overlay = null; render(true); } });
$screen.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === "search") { const q = e.target.q.value.trim(); addRecent(q); if (S.screen === "search") { S.params.q = q; renderResults(); render(true); } else go("search", { q }); }
  if (f === "sub") { S.subscribed = true; store.set("sub", true); toast("সাবস্ক্রাইব সম্পন্ন · ইমেইল যাচাই করুন"); }
  if (f === "login") { S.loggedIn = true; store.set("login", true); S.screen = "dashboard"; render(); }
  if (f === "report") {
    const desc = document.getElementById("r-desc").value.trim(), hint = document.getElementById("r-hint");
    if (document.getElementById("r-web").value) return; // honeypot: silently ignore bots
    if (S.reportLock > Date.now()) return;
    if (desc.length < 15) { hint.textContent = "অনুগ্রহ করে কমপক্ষে ১৫ অক্ষরে সমস্যাটি লিখুন"; hint.style.color = "var(--red)"; document.getElementById("r-desc").focus(); return; }
    const type = (document.querySelector("#rtype .chip.on") || {}).dataset?.rtype || "অন্যান্য";
    REPORTS.unshift({ id: Date.now(), type, post: S.params.id || 1, msg: desc, at: Date.now(), status: "new" });
    S.reportLock = Date.now() + 60e3; setTimeout(() => { if (S.screen === "report") render(true); }, 60e3);
    toast("ধন্যবাদ! রিপোর্ট জমা হয়েছে");
  }
});
let qTimer;
$screen.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "search-q") { clearTimeout(qTimer); qTimer = setTimeout(renderResults, 180); }
  if (t.id === "ap-q") { const q = t.value.trim(); document.querySelectorAll("#ap-list .arow").forEach(r => r.hidden = q && !r.dataset.title.includes(q)); }
  if (t.dataset.skey) S.settings[t.dataset.skey] = t.value;
  if (t.id === "gap-custom") { S.settings.gapCustom = Math.max(2, Math.min(20, +t.value || 5)); saveSettings(); const pv = document.querySelector(".preview"); if (pv) { clearTimeout(qTimer); qTimer = setTimeout(() => render(true), 400); } }
});
$screen.addEventListener("change", e => {
  if (e.target.matches("[data-filter]") && S.screen === "search") renderResults();
  if (e.target.id === "as-user") { S.me = +e.target.value; render(true); }
});

/* Live countdown on the details screen */
setInterval(() => { if (S.mode === "public" && S.screen === "detail") { const c = document.getElementById("countdown"), p = postById(S.params.id); if (c && p) c.innerHTML = countdownHTML(p); } }, 1000);

/* ================= Showcase index + spec ================= */
const INDEX = {
  public: [["home", "হোম"], ["categories", "ক্যাটাগরি"], ["category", "ক্যাটাগরির পোস্ট", { id: "govt" }], ["search", "খুঁজুন"], ["trending", "ট্রেন্ডিং"], ["detail", "পোস্ট ডিটেইল", { id: 1 }], ["notice", "নোটিশ"], ["report", "রিপোর্ট", { id: 6 }], ["saved", "সেভ করা চাকরি"], ["about", "আমাদের সম্পর্কে"], ["notfound", "৪০৪"], ["maintenance", "মেইনটেন্যান্স", { preview: 1 }], ["@drawer", "মেনু (ড্রয়ার)"], ["@share", "শেয়ার পপআপ"], ["@push", "পুশ নোটিফিকেশন"], ["@remind", "ডেডলাইন রিমাইন্ডার"]],
  admin: [["login", "লগইন"], ["dashboard", "ড্যাশবোর্ড"], ["posts", "পোস্ট তালিকা"], ["editor", "পোস্ট এডিটর", { id: 1 }], ["promotions", "প্রমোশন"], ["categories", "ক্যাটাগরি"], ["notices", "নোটিশ"], ["reports", "রিপোর্ট"], ["automation", "অটোমেশন"], ["team", "টিম ও পারমিশন"], ["analytics", "অ্যানালিটিক্স"], ["settings", "সেটিংস"], ["profile", "প্রোফাইল"], ["@adrawer", "মেনু (ড্রয়ার)"]]
};
function renderIndex() {
  const list = INDEX[S.mode];
  const cur = S.overlay ? "@" + S.overlay.type : (S.mode === "admin" && !S.loggedIn ? "login" : S.screen);
  document.getElementById("index").innerHTML = `
    <div class="brandline">${logoMark(38)}<div><b>চাকরি সার্কুলার</b><small>UI প্রোটোটাইপ · মোবাইল-ফার্স্ট</small></div></div>
    <div class="mode" role="tablist"><button class="${S.mode === "public" ? "on" : ""}" data-mode="public">পাবলিক সাইট</button><button class="${S.mode === "admin" ? "on" : ""}" data-mode="admin">অ্যাডমিন</button></div>
    <h4>${S.mode === "public" ? "পাবলিক স্ক্রিন" : "অ্যাডমিন স্ক্রিন"}</h4>
    <ul>${list.map(([k, l], i) => `<li><button class="${cur === k ? "on" : ""}" data-idx="${i}">${l}<span class="num">${bn(i + 1)}</span></button></li>`).join("")}</ul>
    <button class="themebtn" data-idx-theme>${I(isDark() ? "sun" : "moon")}${isDark() ? "লাইট মোড" : "ডার্ক মোড"}</button>`;
}
document.getElementById("index").addEventListener("click", e => {
  const m = e.target.closest("[data-mode]"), x = e.target.closest("[data-idx]"), th = e.target.closest("[data-idx-theme]");
  if (th) return toggleTheme();
  if (m) { S.mode = m.dataset.mode; S.stack = []; S.overlay = null; S.params = {}; S.screen = S.mode === "admin" ? "dashboard" : "home"; return render(); }
  if (x) {
    const [k, , params] = INDEX[S.mode][+x.dataset.idx];
    S.overlay = null;
    if (k === "login") { S.loggedIn = false; S.screen = "dashboard"; return render(); }
    if (S.mode === "admin" && !S.loggedIn) { S.loggedIn = true; store.set("login", true); }
    if (k[0] === "@") {
      const type = k.slice(1);
      if (type === "share" || type === "remind") { S.screen = "detail"; S.params = { id: 1 }; }
      S.overlay = { type, id: 1 }; return render();
    }
    S.stack.push({ mode: S.mode, screen: S.screen, params: S.params });
    S.screen = k; S.params = Object.assign({}, params || {}); if (k !== "maintenance") S.peek = false; render();
  }
});

const SPEC = {
  home: ["হোম", ["হিরোতে শুধু ট্যাগলাইন ও সার্চ, কোনো ব্যানার নেই", "সর্বশেষ আপডেটে প্রতি {gap}টি পোস্ট পরপর একটি প্রমোটেড/প্রিমিয়াম পোস্ট বসে", "ইমেইল সাবস্ক্রিপশন, PWA ইনস্টল কার্ড ও ফুটার নিচে"], ["Organization", "WebSite + SearchAction"]],
  latest: ["সর্বশেষ আপডেট", ["ইনফিনিট স্ক্রলে পরের পেজ AJAX-এ আসে", "প্রমোশন গ্যাপ পুরো ফিড জুড়ে বজায় থাকে"], ["BreadcrumbList"]],
  categories: ["ক্যাটাগরি", ["অ্যাডমিন থেকে ক্রম, আইকন ও চালু/বন্ধ নিয়ন্ত্রিত"], ["BreadcrumbList"]],
  category: ["ক্যাটাগরির পোস্ট", ["বাংলা স্লাগ: /ক্যাটাগরি/সরকারি-চাকরি", "একই জব-কার্ড ডিজাইন"], ["BreadcrumbList", "CollectionPage"]],
  search: ["খুঁজুন", ["টাইপ করলেই ফলাফল, পেজ রিলোড ছাড়া (১৮০ms debounce)", "ক্যাটাগরি, বিভাগ, জেলা ও তারিখ ফিল্টার", "সাম্প্রতিক অনুসন্ধান ডিভাইসে সংরক্ষিত"], ["SearchResultsPage"]],
  trending: ["ট্রেন্ডিং", ["গত ২৪ ঘণ্টার ভিউ অনুযায়ী র‍্যাংকিং", "প্রথম তিনটি আলাদা রঙে"], ["ItemList"]],
  detail: ["পোস্ট ডিটেইল", ["লাইভ কাউন্টডাউন প্রতি সেকেন্ডে আপডেট; শেষ হলে “সময় শেষ”", "৪ দিনের কম বাকি থাকলে লাল, বেশি থাকলে সবুজ", "শেয়ার, সেভ, রিমাইন্ডার ও রিপোর্ট এক জায়গায়"], ["JobPosting", "BreadcrumbList", "Open Graph"]],
  notice: ["নোটিশ", ["২৪ ঘণ্টার কম পুরোনো হলে “নতুন” ব্যাজ", "মেয়াদ শেষে অ্যাডমিন সেটিং অনুযায়ী স্বয়ংক্রিয়ভাবে সরে যায়", "ঐচ্ছিক নোটিফিকেশন সাউন্ড"], ["NewsArticle"]],
  report: ["রিপোর্ট", ["Honeypot ফিল্ড + প্রতি ডিভাইস ১ মিনিটে ১টি রিপোর্ট", "সার্ভারে IP-ভিত্তিক rate limit"], []],
  saved: ["সেভ করা চাকরি", ["ডিভাইসে সংরক্ষিত, লগইন লাগে না", "প্রতি পোস্টে ডেডলাইন রিমাইন্ডার (পুশ নোটিফিকেশন)"], []],
  notfound: ["৪০৪", ["সঠিক 404 স্ট্যাটাস কোড, noindex"], []],
  maintenance: ["মেইনটেন্যান্স", ["503 + Retry-After হেডার", "লগইন করা অ্যাডমিন আসল সাইট দেখতে পারেন"], []],
  promotions: ["প্রমোশন", ["আলাদা বিজ্ঞাপন নেই; বিদ্যমান পোস্টই প্রমোশন", "গ্যাপ বদলালে ফিড প্রিভিউ ও পাবলিক সাইট সঙ্গে সঙ্গে বদলায়", "মেয়াদ শেষে পোস্ট সাধারণ পোস্টে ফিরে যায়", "প্রতি পেজে সর্বোচ্চ প্রদর্শন সীমা"], []],
  automation: ["অটোমেশন", ["Source → Check Duplicate → OpenAI → Rewrite → Draft → Admin Review", "AI কনটেন্ট কখনো নিজে প্রকাশ হয় না", "In-app scheduler, ঐচ্ছিক cron", "লগ SSE দিয়ে লাইভ আপডেট"], []],
  team: ["টিম ও পারমিশন", ["রোল-ভিত্তিক অ্যাক্সেস (RBAC)", "উপরের “লগইন” ড্রপডাউন থেকে মডারেটর হিসেবে দেখে মেনু পরীক্ষা করুন"], []]
};
const PERF = ["একটি Node.js প্রসেস (Hostinger shared hosting)", "AJAX নেভিগেশন + History API (ব্যাক/ফরোয়ার্ড কাজ করে)", "লিংকে hover/touch-এ prefetch", "lazy loading ও WebP ইমেজ, srcset", "ক্রিটিক্যাল CSS inline, JS < ৩০ KB"];
function renderSpec() {
  const s = SPEC[S.screen] || [S.mode === "admin" ? "অ্যাডমিন প্যানেল" : "পাবলিক পেজ", ["পাবলিক সাইটের একই ব্র্যান্ড, ড্যাশবোর্ড-ধাঁচের লেআউট"], []];
  const p = postById(S.params.id) || POSTS[0];
  const ld = S.mode === "public" && S.screen === "detail" ? JSON.stringify({ "@context": "https://schema.org", "@type": "JobPosting", title: p.title, hiringOrganization: { "@type": "Organization", name: p.org }, datePosted: new Date(p.postedAt).toISOString().slice(0, 10), validThrough: new Date(p.endAt).toISOString(), employmentType: "FULL_TIME", jobLocation: { "@type": "Place", address: { "@type": "PostalAddress", addressRegion: p.div, addressCountry: "BD" } }, url: "https://cakricircular.com/চাকরি/" + p.slug }, null, 2) : "";
  document.getElementById("spec").innerHTML = `
    <section><h3>${s[0]}</h3><ul>${s[1].map(x => `<li>${x.replace("{gap}", bn(gapVal()))}</li>`).join("")}</ul>${s[2].length ? `<div class="chiprow" style="margin-top:10px">${s[2].map(x => `<code>${x}</code>`).join("")}</div>` : ""}${ld ? `<pre>${esc(ld)}</pre>` : ""}</section>
    <section><h3>প্রমোশন ইঞ্জিন</h3><p>বর্তমান গ্যাপ: প্রতি <b>${bn(gapVal())}</b>টি সাধারণ পোস্টের পর ১টি প্রমোশনাল পোস্ট। সক্রিয় প্রমোশন: ${bn(POSTS.filter(x => promoActive(x)).length)}টি। অ্যাডমিন &gt; প্রমোশন থেকে বদলান।</p></section>
    <section><h3>পারফরম্যান্স</h3><ul>${PERF.map(x => `<li>${x}</li>`).join("")}</ul></section>
    <section><h3>SEO</h3><div class="chiprow">${["Organization", "WebSite", "JobPosting", "NewsArticle", "BreadcrumbList", "sitemap.xml", "robots.txt", "canonical", "Open Graph", "Twitter Card"].map(x => `<code>${x}</code>`).join("")}</div></section>`;
}

/* ================= Boot ================= */
(() => { const t = store.get("theme", null); if (t) document.documentElement.setAttribute("data-theme", t); })();
if (location.hash === "#admin") { S.mode = "admin"; S.screen = "dashboard"; }
render();
setTimeout(() => { if (!S.pushAsked && S.mode === "public" && !S.overlay && S.screen === "home") { S.overlay = { type: "push" }; render(true); } }, 2500);
</script>
</body>
