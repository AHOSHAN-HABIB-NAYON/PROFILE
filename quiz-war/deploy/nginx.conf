# quizwar.app → web PWA + /v2admin; api.quizwar.app → API + WebSocket.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream quizwar_api {
  # Multiple API nodes need sticky sessions for Socket.IO (ip_hash) + REDIS_URL set.
  ip_hash;
  server api:4000;
}

server {
  listen 80;
  server_name quizwar.app api.quizwar.app;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name quizwar.app;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com/gsi/style; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://api.quizwar.app https://*.googleusercontent.com; connect-src 'self' https://api.quizwar.app wss://api.quizwar.app https://accounts.google.com/gsi/; frame-src https://accounts.google.com/gsi/; worker-src 'self'; base-uri 'self'; form-action 'self'" always;

  root /srv/web;

  # Public, SEO-friendly profile pages are rendered by the API (Open Graph tags).
  location ~ ^/u/[^/]+/?$ {
    if ($http_user_agent ~* "(bot|crawler|spider|facebookexternalhit|twitterbot|whatsapp|telegram|slack|discord)") { proxy_pass http://quizwar_api; }
    try_files /index.html =404;
  }
  location = /.well-known/assetlinks.json { proxy_pass http://quizwar_api; }
  location /v2admin/ {
    alias /srv/admin/;
    try_files $uri $uri/ /v2admin/index.html;
    add_header X-Robots-Tag "noindex, nofollow" always;
  }
  location = /sw.js { add_header Cache-Control "no-cache"; }
  location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri /index.html; }
}

server {
  listen 443 ssl;
  http2 on;
  server_name api.quizwar.app;
  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  client_max_body_size 12m;

  location /media/ {
    alias /srv/media/;
    add_header Cache-Control "public, max-age=2592000, immutable";
    add_header X-Content-Type-Options nosniff always;
  }
  location /socket.io/ {
    proxy_pass http://quizwar_api;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
  location / {
    proxy_pass http://quizwar_api;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }
}
