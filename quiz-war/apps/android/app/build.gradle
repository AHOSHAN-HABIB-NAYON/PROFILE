apply plugin: 'com.android.application'

// ── Release signing ──────────────────────────────────────────────────────────
// The upload keystore is NEVER committed. Provide it either through
//   apps/android/keystore.properties   (local machine, git-ignored), or
//   environment variables              (CI: QW_KEYSTORE_FILE, QW_KEYSTORE_PASSWORD,
//                                        QW_KEY_ALIAS, QW_KEY_PASSWORD)
// See docs/android-release.md.
def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingValue = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def releaseStoreFile = signingValue('storeFile', 'QW_KEYSTORE_FILE')

// ── Versioning ──────────────────────────────────────────────────────────────
// versionCode must increase with every Play Store upload. CI passes it explicitly.
def qwVersionCode = (System.getenv('QW_VERSION_CODE') ?: project.findProperty('qwVersionCode') ?: '1') as Integer
def qwVersionName = System.getenv('QW_VERSION_NAME') ?: project.findProperty('qwVersionName') ?: '1.0.0'
def qwAppLinkHost = System.getenv('QW_APP_LINK_HOST') ?: project.findProperty('qwAppLinkHost') ?: 'quizwar.app'

android {
    namespace "app.quizwar.bd"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "app.quizwar.bd"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode qwVersionCode
        versionName qwVersionName
        manifestPlaceholders = [appLinkHost: qwAppLinkHost]
        // Push only works when Firebase's google-services.json is bundled (see docs/android-release.md).
        buildConfigField "boolean", "PUSH_ENABLED", file('google-services.json').exists() ? "true" : "false"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            // A library ships its own META-INF/.../MANIFEST.MF; some phone installers (e.g. Vivo)
            // read it instead of the app's signed manifest and reject the APK as unsigned.
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }
    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile file(releaseStoreFile)
                storePassword signingValue('storePassword', 'QW_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'QW_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'QW_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Capacitor plugins rely on reflection; keep R8 off unless rules are verified on a device.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
        }
    }
    bundle {
        language { enableSplit = false } // keep Bangla + English resources in every install
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    // WebAuthn/passkeys inside the WebView (Credential Manager backed)
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    // Native passkeys (Credential Manager; play-services-auth backs it on Android 9–13)
    implementation "androidx.credentials:credentials:1.5.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
