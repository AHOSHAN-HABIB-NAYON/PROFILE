<!doctype html>
<html lang="bn" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>QUIZ WAR: Bangladesh — Multiplayer Quiz Battles</title>
    <meta name="description" content="বাংলাদেশের রিয়েলটাইম মাল্টিপ্লেয়ার কুইজ গেম। 1 VS 1, Duo, Squad ও AI ব্যাটল, র‍্যাংক, লীগ আর ডেইলি চ্যালেঞ্জ।" />
    <meta property="og:title" content="QUIZ WAR: Bangladesh" />
    <meta property="og:description" content="Realtime multiplayer quiz battles — BCS, Bangladesh, ICT, Bank, English and more." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before first paint (no flash). Light is the default.
      try {
        var t = JSON.parse(localStorage.getItem('qw-settings') || '{}').state?.theme || 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>QUIZ WAR needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
