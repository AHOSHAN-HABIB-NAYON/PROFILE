; PHP settings for shared hosting (Hostinger reads .user.ini in the site root).
; Allows product photos straight from phone cameras (the app compresses them).
upload_max_filesize = 10M
post_max_size = 40M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
display_errors = Off
log_errors = On
expose_php = Off
session.cookie_httponly = 1
session.use_strict_mode = 1
