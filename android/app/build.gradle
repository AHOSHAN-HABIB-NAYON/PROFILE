plugins {
    id 'com.android.application'
}

android {
    namespace 'com.cakricircular.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.cakricircular.app'
        minSdk 24
        targetSdk 36
        versionCode 11
        versionName '2.6'
        // শুধু বাংলা আর ইংরেজি — লাইব্রেরির অন্য ভাষার লেখা বাদ (সাইজ কমে)
        resourceConfigurations += ['bn', 'en']
    }

    // Play upload key: decoded from GitHub secrets by the CI workflow, never stored in the repo.
    signingConfigs {
        release {
            def ks = System.getenv('QW_KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('QW_KEYSTORE_PASSWORD')
                keyAlias System.getenv('QW_KEY_ALIAS')
                keyPassword System.getenv('QW_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv('QW_KEYSTORE_FILE')) signingConfig signingConfigs.release
            // ছোট সাইজ: অপ্রয়োজনীয় কোড ও রিসোর্স বাদ
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    dependenciesInfo {
        includeInApk false
        includeInBundle false
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // শুধু Firebase Cloud Messaging — আর কিছু নয়
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
