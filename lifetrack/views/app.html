<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#F4F6FB">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="{{site}}">
<meta name="application-name" content="{{site}}">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{favicon}}">
<link rel="apple-touch-icon" href="{{apple}}">
<link rel="canonical" href="{{canonical}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="/css/base.css?v={{v}}">
<link rel="stylesheet" href="/css/app.css?v={{v}}">
<link rel="modulepreload" href="/js/core.js">
<script src="/js/boot.js?v={{v}}"></script>
<script type="module" src="/js/app.js"></script>
</head>
<body class="app">
{{sprite}}
<a class="skip-link" href="#main">Skip to content</a>
<div class="boot" aria-hidden="true"><div class="boot-inner"><svg class="logo"><use href="#logo"/></svg><b>{{site}}</b><small>{{tagline}}</small><div class="bar"></div></div></div>
<aside class="sidebar" aria-label="Sidebar"></aside>
<div class="shell">
  <header class="topbar"></header>
  <main id="main" tabindex="-1"><div id="view" class="view-stack" aria-live="polite"></div></main>
</div>
<nav class="tabbar" aria-label="Primary"></nav>
<noscript><p style="padding:24px;text-align:center">{{site}} needs JavaScript enabled.</p></noscript>
</body>
</html>
