    <circle r="30" fill="url(#gold)"/>
    <circle r="22" fill="none" stroke="#fff6cc" stroke-width="3" opacity=".8"/>
    <text x="0" y="9" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="800" fill="#a86b00">$</text>
  </g>
  <g transform="translate(46 96)" opacity=".95">
    <circle r="16" fill="url(#gold)"/><text x="0" y="6" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="800" fill="#a86b00">₿</text>
  </g>
