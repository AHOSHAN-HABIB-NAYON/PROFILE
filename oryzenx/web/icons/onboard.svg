    <path d="M78 196 L104 205 L104 150 L78 141 Z" fill="url(#bA)"/><path d="M104 205 L118 199 L118 144 L104 150 Z" fill="url(#bS)"/><path d="M78 141 L92 135 L118 144 L104 150 Z" fill="url(#bT)"/>
