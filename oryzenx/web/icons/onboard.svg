<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 260">
  <defs>
    <linearGradient id="bA" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ea0ff"/><stop offset="1" stop-color="#1747d1"/></linearGradient>
    <linearGradient id="bS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f6bff"/><stop offset="1" stop-color="#0d2a8a"/></linearGradient>
    <linearGradient id="bT" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9cc8ff"/><stop offset="1" stop-color="#6aa6ff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a500"/></linearGradient>
    <linearGradient id="arrow" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#0ecb81"/><stop offset="1" stop-color="#7cf5c4"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".55" r=".55"><stop offset="0" stop-color="#2f6bff" stop-opacity=".35"/><stop offset="1" stop-color="#2f6bff" stop-opacity="0"/></radialGradient>
  </defs>
  <ellipse cx="160" cy="150" rx="150" ry="110" fill="url(#glow)"/>
  <!-- base plate -->
