name: DevicePilot Android build

on:
  push:
    paths:
      - "DevicePilot/**"
      - ".github/workflows/devicepilot-android.yml"
  pull_request:
    paths:
      - "DevicePilot/**"
  workflow_dispatch:

concurrency:
  group: devicepilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DevicePilot

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug
      - name: Build release bundle (unsigned check)
        run: ./gradlew --stacktrace bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePilot-debug-apk
          path: DevicePilot/app/build/outputs/apk/debug/*.apk
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: DevicePilot/app/build/reports/tests/

  device-tests:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: DevicePilot
          script: ./gradlew --stacktrace connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: DevicePilot/app/build/reports/androidTests/
