name: DevicePilot Android build

on:
  push:
    paths:
      - "DevicePilot/**"
      - ".github/workflows/devicepilot-android.yml"
  pull_request:
    paths:
      - "DevicePilot/**"
  workflow_dispatch:

concurrency:
  group: devicepilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DevicePilot

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --stacktrace testDebugUnitTest
      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug
      - name: Build optimized release APK and bundle
        run: ./gradlew --stacktrace assembleRelease bundleRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePilot-debug-apk
          path: DevicePilot/app/build/outputs/apk/debug/*.apk
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePilot-release-apk
          path: DevicePilot/app/build/outputs/apk/release/*.apk
      - name: Prepare direct-download APK
        run: cp app/build/outputs/apk/release/app-release.apk DevicePilot.apk
      - name: Publish test build (direct download link)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: devicepilot-test
          name: DevicePilot test build
          prerelease: true
          files: DevicePilot/DevicePilot.apk
          body: |
            Latest DevicePilot test build (optimized release APK, signed with a test key — not for Play Store upload).
            Direct download: https://github.com/${{ github.repository }}/releases/download/devicepilot-test/DevicePilot.apk
            Built from commit ${{ github.sha }}.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: DevicePilot/app/build/reports/tests/

  device-tests:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: DevicePilot
          script: ./gradlew --stacktrace connectedDebugAndroidTest
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: DevicePilot/app/build/reports/androidTests/
