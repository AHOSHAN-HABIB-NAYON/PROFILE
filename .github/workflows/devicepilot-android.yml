name: Devicepilot Android build

on:
  push:
    paths:
      - "Devicepilot/**"
      - ".github/workflows/devicepilot-android.yml"
  pull_request:
    paths:
      - "Devicepilot/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Devicepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and lint
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: devicepilot-debug-apk
          path: Devicepilot/app/build/outputs/apk/debug/app-debug.apk
