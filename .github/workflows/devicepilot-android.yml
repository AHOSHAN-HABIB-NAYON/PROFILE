name: DevicePilot Android build

on:
  push:
    paths:
      - "DevicePilot/**"
      - ".github/workflows/devicepilot-android.yml"
  pull_request:
    paths:
      - "DevicePilot/**"
  workflow_dispatch:

concurrency:
  group: devicepilot-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: DevicePilot

jobs:
  build:
    name: Build debug APK + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests
        run: ./gradlew --stacktrace testPlayDebugUnitTest testFullDebugUnitTest
      - name: Build debug APKs (Play + Full)
        run: ./gradlew --stacktrace assemblePlayDebug assembleFullDebug
      - name: Build release APKs and the Play Store bundle
        run: ./gradlew --stacktrace assemblePlayRelease bundlePlayRelease assembleFullRelease
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePilot-debug-apk
          path: DevicePilot/app/build/outputs/apk/*/debug/*.apk
      - name: Upload optimized release APK
        uses: actions/upload-artifact@v4
        with:
          name: DevicePilot-release-apk
          path: |
            DevicePilot/app/build/outputs/apk/*/release/*.apk
            DevicePilot/app/build/outputs/bundle/playRelease/*.aab
      - name: Prepare direct-download APK
        run: |
          cp app/build/outputs/apk/full/release/app-full-release.apk DevicePilot.apk
          cp app/build/outputs/apk/play/release/app-play-release.apk DevicePilot-Play.apk
          cp app/build/outputs/bundle/playRelease/app-play-release.aab DevicePilot-Play.aab
      - name: Publish test build (direct download link)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: devicepilot-test
          name: DevicePilot test build
          prerelease: true
          files: |
            DevicePilot/DevicePilot.apk
            DevicePilot/DevicePilot-Play.apk
            DevicePilot/DevicePilot-Play.aab
          body: |
            Latest DevicePilot test builds (signed with a test key — the .aab must be re-built with your release key before uploading to Play).
            Full edition (all features): https://github.com/${{ github.repository }}/releases/download/devicepilot-test/DevicePilot.apk
            Play edition: https://github.com/${{ github.repository }}/releases/download/devicepilot-test/DevicePilot-Play.apk
            Built from commit ${{ github.sha }}.
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: DevicePilot/app/build/reports/tests/

  device-tests:
    name: Instrumented tests (emulator API 34)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented tests
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          working-directory: DevicePilot
          profile: pixel_6
          script: |
            ./gradlew --stacktrace connectedFullDebugAndroidTest connectedPlayDebugAndroidTest
            mkdir -p screenshots && adb pull /data/local/tmp/dp_shots/. screenshots/ || true
      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-reports
          path: DevicePilot/app/build/reports/androidTests/
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: DevicePilot/screenshots/
      - name: Publish screenshots to the test release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: devicepilot-test
          files: DevicePilot/screenshots/*.png
