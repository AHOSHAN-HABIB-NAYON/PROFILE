name: OryzenX CI

# Builds and tests the OryzenX Investment Monitor:
#  - php:     syntax check + PHPUnit (unit + integration) against a real MySQL 8 database
#  - android: compiles the native Android app, runs lint + unit tests and uploads the APKs
on:
  push:
    paths:
      - "oryzenx/**"
      - ".github/workflows/oryzenx-ci.yml"
  pull_request:
    paths:
      - "oryzenx/**"
      - ".github/workflows/oryzenx-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oryzenx-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpass
          MYSQL_DATABASE: oryzenx_test
          MYSQL_USER: oryzenx
          MYSQL_PASSWORD: ci-only-password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -prootpass"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults:
      run:
        working-directory: oryzenx
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: oryzenx_test
      DB_USER: root
      DB_PASS: rootpass
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, sodium, gd, bcmath, curl, pcntl
          coverage: none
      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Syntax check
        run: find app bin public routes resources tests database -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        run: vendor/bin/phpunit --colors=always

  android:
    name: Android build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publishes the installable APK to the "android-latest" release
    defaults:
      run:
        working-directory: oryzenx/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Optional Firebase config (secret ORYZENX_GOOGLE_SERVICES_JSON_B64)
        env:
          GS: ${{ secrets.ORYZENX_GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > app/google-services.json; echo "Firebase config added"; else echo "No Firebase config: push disabled in this build"; fi
      - name: Optional release keystore (secret ORYZENX_KEYSTORE_B64)
        env:
          KS: ${{ secrets.ORYZENX_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ORYZENX_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"; echo "Release keystore added"; else echo "No keystore: release APK will be unsigned"; fi
      - name: Build, lint and unit-test
        env:
          ORYZENX_KEYSTORE_PASSWORD: ${{ secrets.ORYZENX_KEYSTORE_PASSWORD }}
          ORYZENX_KEY_ALIAS: ${{ secrets.ORYZENX_KEY_ALIAS }}
          ORYZENX_KEY_PASSWORD: ${{ secrets.ORYZENX_KEY_PASSWORD }}
          ORYZENX_VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug assembleRelease lintDebug testDebugUnitTest
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: oryzenx-android-apks
          path: oryzenx/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Publish installable APK (release "android-latest")
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/oryzenx-android.apk"
          gh release delete android-latest --yes --cleanup-tag --repo "$GITHUB_REPOSITORY" || true
          gh release create android-latest "$RUNNER_TEMP/oryzenx-android.apk" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --prerelease --title "OryzenX Android (latest test build)" \
            --notes "Installable test build from commit ${GITHUB_SHA::7} (${GITHUB_REF_NAME}). Connects to https://bd.oryzenx.com. Debug-signed for testing; use a signed release build for the Play Store."
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oryzenx-android-lint
          path: oryzenx/android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
