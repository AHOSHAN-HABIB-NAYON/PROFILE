name: AppFix Studio CI

on:
  push:
    paths:
      - "appfix-studio/**"
      - ".github/workflows/appfix-studio.yml"
  pull_request:
    paths:
      - "appfix-studio/**"
      - ".github/workflows/appfix-studio.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appfix-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test, lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    defaults:
      run:
        working-directory: appfix-studio
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Build the sample project (real Gradle build)
        run: ./gradlew -p sample-project assembleDebug --stacktrace

      - name: Verify the sample APK signature with apksigner
        run: |
          APK=sample-project/app/build/outputs/apk/debug/app-debug.apk
          ls -l "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Core unit tests (includes inspection of the real sample APK)
        run: |
          export APPFIX_SAMPLE_APK="$PWD/sample-project/app/build/outputs/apk/debug/app-debug.apk"
          export APPFIX_FRAMEWORK_JAR="$ANDROID_HOME/platforms/android-36/android.jar"
          export APPFIX_GENERATED_OUT="$RUNNER_TEMP/generated"
          export APPFIX_MODIFIED_OUT="$RUNNER_TEMP/sample-modified-unsigned.apk"
          ./gradlew :core:test --stacktrace

      - name: Compile projects modified by the generators (Kotlin+XML, Java+XML, Compose)
        run: |
          for variant in kotlin-xml java-xml compose; do
            echo "::group::Build $variant"
            ./gradlew -p "$RUNNER_TEMP/generated/$variant" assembleDebug --stacktrace
            echo "::endgroup::"
          done

      - name: App unit tests (includes apksig re-signing of the sample APK)
        run: |
          export APPFIX_SAMPLE_APK="$PWD/sample-project/app/build/outputs/apk/debug/app-debug.apk"
          export APPFIX_MODIFIED_OUT="$RUNNER_TEMP/sample-modified-unsigned.apk"
          export APPFIX_SIGNED_OUT="$RUNNER_TEMP/sample-modified-signed.apk"
          ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Check the modified and re-signed sample APK with apksigner and aapt2
        run: |
          APK="$RUNNER_TEMP/sample-modified-signed.apk"
          BT="$ANDROID_HOME/build-tools/36.0.0"
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/badging.txt" | head -20
          grep -q "versionCode='7'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.0-appfix'" "$RUNNER_TEMP/badging.txt"
          grep -q "application-label:'Sample Modified'" "$RUNNER_TEMP/badging.txt"
          "$BT/zipalign" -c -P 16 4 "$APK"

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Assemble minified release APK (signed with a throwaway CI key)
        run: |
          # The key is generated on the runner for this job only, so the minified build can be installed
          # by the device smoke test. Real release signing uses the owner's secrets in the release workflow.
          export APPFIX_RELEASE_KEYSTORE="$RUNNER_TEMP/ci-throwaway.p12"
          export APPFIX_RELEASE_STORE_PASSWORD="$(openssl rand -hex 16)"
          export APPFIX_RELEASE_KEY_ALIAS=ci
          keytool -genkeypair -keystore "$APPFIX_RELEASE_KEYSTORE" -storetype PKCS12 -alias ci -keyalg RSA -keysize 2048 \
            -validity 2 -dname "CN=AppFix CI throwaway" -storepass "$APPFIX_RELEASE_STORE_PASSWORD" -keypass "$APPFIX_RELEASE_STORE_PASSWORD" > /dev/null
          ./gradlew :app:assembleRelease --stacktrace
          rm -f "$APPFIX_RELEASE_KEYSTORE"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify app/build/outputs/apk/release/app-release.apk
          ls -l app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk

      - name: Upload AppFix Studio debug APK
        uses: actions/upload-artifact@v4
        with:
          name: appfix-studio-debug-apk
          path: appfix-studio/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload APKs for the device smoke test
        uses: actions/upload-artifact@v4
        with:
          name: smoke-apks
          path: |
            appfix-studio/app/build/outputs/apk/debug/*.apk
            appfix-studio/app/build/outputs/apk/release/*.apk
            appfix-studio/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 3

      - name: Upload sample APK
        uses: actions/upload-artifact@v4
        with:
          name: sample-project-debug-apk
          path: appfix-studio/sample-project/app/build/outputs/apk/debug/*.apk

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            appfix-studio/core/build/reports/
            appfix-studio/app/build/reports/
            appfix-studio/core/build/test-results/
            appfix-studio/app/build/test-results/
          if-no-files-found: ignore

  device-smoke:
    name: Device smoke test (API ${{ matrix.api }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 24
            target: default
            arch: x86
          - api: 35
            target: google_apis
            arch: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: smoke-apks
          path: ${{ runner.temp }}/smoke

      - name: Collect APKs
        run: |
          mkdir -p "$RUNNER_TEMP/apks"
          find "$RUNNER_TEMP/smoke" -name '*.apk' -exec cp {} "$RUNNER_TEMP/apks/" \;
          ls -l "$RUNNER_TEMP/apks"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and walk the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash appfix-studio/tools/ci/device-smoke.sh "${{ runner.temp }}/apks"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots-api${{ matrix.api }}
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
