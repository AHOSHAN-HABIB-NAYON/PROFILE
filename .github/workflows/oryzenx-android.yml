# Builds the OryzenX BD Android app (APK) for direct sharing. No Play Store needed.
# Run it from the Actions tab: "OryzenX Android APK" -> Run workflow -> enter your site URL.
name: OryzenX Android APK

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: 'Your live site URL, e.g. https://oryzenx.your-domain.com'
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oryzenx/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Point the app at your server
        env:
          APP_URL: ${{ inputs.app_url }}
        run: |
          case "$APP_URL" in https://*) ;; *) echo "app_url must start with https://"; exit 1;; esac
          node -e "const f='capacitor.config.json';const c=require('./'+f);c.server.url=process.env.APP_URL.replace(/\/$/,'');require('fs').writeFileSync(f,JSON.stringify(c,null,2))"
          cat capacitor.config.json
      - name: Create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Camera permission (ID card and face verification)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' $M || sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' $M
          grep -n "permission\|uses-feature" $M
      - name: App icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher.png
            convert icon-512.png -resize ${s}x${s} $RES/mipmap-$n/ic_launcher_round.png
          done
      - name: Build APK
        working-directory: oryzenx/mobile/android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: oryzenx-bd-apk
          path: oryzenx/mobile/android/app/build/outputs/apk/debug/app-debug.apk
