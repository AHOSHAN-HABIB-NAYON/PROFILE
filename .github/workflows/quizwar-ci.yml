name: QUIZ WAR CI

on:
  push:
    paths: ['quiz-war/**', '.github/workflows/quizwar-ci.yml']
  pull_request:
    paths: ['quiz-war/**', '.github/workflows/quizwar-ci.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must increase for every Play upload)'
        required: false
      version_name:
        description: 'Android versionName, e.g. 1.0.3'
        required: false
      site_url:
        description: 'Your live site, e.g. https://quizwar.webtecit.com (API + share links)'
        required: false

permissions:
  contents: read

defaults:
  run:
    working-directory: quiz-war

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quizwar_test
          MYSQL_USER: quizwar
          MYSQL_PASSWORD: devpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://quizwar:devpass@127.0.0.1:3306/quizwar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-war/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the installable APK as a GitHub Release
    env:
      QW_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      QW_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      VITE_API_URL: ${{ inputs.site_url || vars.QW_API_URL || 'https://quizwar.webtecit.com' }}
      VITE_PUBLIC_WEB_URL: ${{ inputs.site_url || vars.QW_WEB_URL || 'https://quizwar.webtecit.com' }}
      QW_APP_LINK_HOST: ${{ vars.QW_APP_LINK_HOST || 'quizwar.webtecit.com' }}
      HAS_KEYSTORE: ${{ secrets.QW_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.QW_GOOGLE_SERVICES_JSON_BASE64 != '' || secrets.QW_GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-war/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web bundle and sync into the Android project
        working-directory: quiz-war/apps/web
        run: npm run build && npx cap sync android
      # Push notifications: Firebase config is optional. Without it the app builds and simply hides push.
      # Register BOTH app.quizwar.bd and app.quizwar.bd.debug in the Firebase project.
      - name: Firebase config (optional)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        working-directory: quiz-war/apps/android
        env:
          GS_JSON: ${{ secrets.QW_GOOGLE_SERVICES_JSON }}
          GS_B64: ${{ secrets.QW_GOOGLE_SERVICES_JSON_BASE64 }}
        # Either paste the google-services.json content as-is (QW_GOOGLE_SERVICES_JSON) or base64.
        run: |
          if [ -n "$GS_JSON" ]; then printf '%s' "$GS_JSON" > app/google-services.json; else echo "$GS_B64" | base64 -d > app/google-services.json; fi
          python3 -c "import json; d=json.load(open('app/google-services.json')); print('Firebase project:', d['project_info']['project_id'])"
      # Signing: with the upload-key secrets every build is signed with the SAME key, so Google
      # login and passkeys keep working (they are tied to the certificate fingerprint).
      # The keystore lives ONLY in GitHub encrypted secrets (base64), never in the repo.
      - name: Prepare signing key (optional)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        run: |
          echo "${{ secrets.QW_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "QW_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build APK (+ AAB when signed)
        working-directory: quiz-war/apps/android
        env:
          QW_KEYSTORE_PASSWORD: ${{ secrets.QW_KEYSTORE_PASSWORD }}
          QW_KEY_ALIAS: ${{ secrets.QW_KEY_ALIAS }}
          QW_KEY_PASSWORD: ${{ secrets.QW_KEY_PASSWORD }}
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            ./gradlew --no-daemon assembleRelease bundleRelease
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/QuizWar.apk"
            # The .aab is what Google Play wants (upload it in Play Console → Release).
            cp app/build/outputs/bundle/release/app-release.aab "$RUNNER_TEMP/QuizWar-play.aab"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/QuizWar.apk"
          fi
      - name: Certificate fingerprints (for Google login, passkeys, App Links)
        id: certs
        continue-on-error: true
        run: |
          # Read the certificate straight from the built APK, so it is always the key that was really used.
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          out=$("$APKSIGNER" verify --print-certs "$RUNNER_TEMP/QuizWar.apk")
          colon() { tr 'a-f' 'A-F' | sed 's/../&:/g; s/:$//'; }
          raw256=$(echo "$out" | grep -m1 'SHA-256 digest:' | awk '{print $NF}')
          sha1=$(echo "$out" | grep -m1 'SHA-1 digest:' | awk '{print $NF}' | colon)
          sha256=$(echo "$raw256" | colon)
          hash=$(python3 -c "import base64,sys; print(base64.urlsafe_b64encode(bytes.fromhex(sys.argv[1])).decode().rstrip('='))" "$raw256")
          {
            echo "sha1=$sha1"
            echo "sha256=$sha256"
            echo "apkhash=$hash"
          } >> "$GITHUB_OUTPUT"
          echo "SHA-1:   $sha1"
          echo "SHA-256: $sha256"
          echo "WebAuthn origin: android:apk-key-hash:$hash"
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        with:
          name: quizwar-apk
          path: ${{ runner.temp }}/QuizWar.apk
      # Stable download link for testers: /releases/download/app-latest/QuizWar.apk
      - name: Publish APK release (app-latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA1: ${{ steps.certs.outputs.sha1 }}
          SHA256: ${{ steps.certs.outputs.sha256 }}
          APKHASH: ${{ steps.certs.outputs.apkhash }}
        working-directory: quiz-war/apps/android
        run: |
          if [ "$HAS_KEYSTORE" = "true" ]; then
            KIND="signed release"; PKG="app.quizwar.bd"
            NOTE="Signed with your upload key — the fingerprints below stay the same on every build."
          else
            KIND="debug test build"; PKG="app.quizwar.bd.debug"
            NOTE="WARNING: no signing secrets set, so this build uses a temporary debug key that changes every build. Google login and passkeys in the APK need the QW_UPLOAD_KEYSTORE_BASE64 / QW_KEYSTORE_PASSWORD / QW_KEY_ALIAS / QW_KEY_PASSWORD secrets (see docs/hostinger-bn.md)."
          fi
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          Installable APK ($KIND) for ${VITE_PUBLIC_WEB_URL}. Package: \`$PKG\`. Built from ${GITHUB_SHA::7}.

          $NOTE

          | Use | Value |
          |---|---|
          | Google Cloud → Android OAuth client → SHA-1 | \`$SHA1\` |
          | Hostinger \`ANDROID_SHA256_CERT_FINGERPRINTS\` | \`$SHA256\` |
          | Add to Hostinger \`WEBAUTHN_ORIGIN\` (comma separated) | \`android:apk-key-hash:$APKHASH\` |
          NOTES
          sed -i 's/^          //' "$RUNNER_TEMP/notes.md"
          # The server reads this to offer in-app updates automatically.
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$QW_VERSION_CODE" "$QW_VERSION_NAME" > "$RUNNER_TEMP/version.json"
          gh release delete app-latest -y --cleanup-tag || true
          ASSETS=("$RUNNER_TEMP/QuizWar.apk" "$RUNNER_TEMP/version.json")
          [ -f "$RUNNER_TEMP/QuizWar-play.aab" ] && ASSETS+=("$RUNNER_TEMP/QuizWar-play.aab")
          gh release create app-latest "${ASSETS[@]}" --target "$GITHUB_SHA" --prerelease \
            --title "QUIZ WAR Android (${QW_VERSION_NAME}-${QW_VERSION_CODE}, $KIND)" \
            --notes-file "$RUNNER_TEMP/notes.md"

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('quiz-war/apps/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: quizwar-release-aab
          path: quiz-war/apps/android/app/build/outputs/bundle/release/*.aab
