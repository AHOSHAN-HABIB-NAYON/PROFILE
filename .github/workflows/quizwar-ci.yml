name: QUIZ WAR CI

on:
  push:
    paths: ['quiz-war/**', '.github/workflows/quizwar-ci.yml']
  pull_request:
    paths: ['quiz-war/**', '.github/workflows/quizwar-ci.yml']
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android versionCode (must increase for every Play upload)'
        required: false
      version_name:
        description: 'Android versionName, e.g. 1.0.3'
        required: false
      site_url:
        description: 'Your live site, e.g. https://quizwar.webtecit.com (API + share links)'
        required: false

permissions:
  contents: read

defaults:
  run:
    working-directory: quiz-war

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: quizwar_test
          MYSQL_USER: quizwar
          MYSQL_PASSWORD: devpass
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      TEST_DATABASE_URL: mysql://quizwar:devpass@127.0.0.1:3306/quizwar_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-war/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  android:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write   # publish the installable APK as a GitHub Release
    env:
      QW_VERSION_CODE: ${{ inputs.version_code || github.run_number }}
      QW_VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
      VITE_API_URL: ${{ inputs.site_url || vars.QW_API_URL || 'https://quizwar.webtecit.com' }}
      VITE_PUBLIC_WEB_URL: ${{ inputs.site_url || vars.QW_WEB_URL || 'https://quizwar.webtecit.com' }}
      QW_APP_LINK_HOST: ${{ vars.QW_APP_LINK_HOST || 'quizwar.webtecit.com' }}
      HAS_KEYSTORE: ${{ secrets.QW_UPLOAD_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.QW_GOOGLE_SERVICES_JSON_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: quiz-war/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web bundle and sync into the Android project
        working-directory: quiz-war/apps/web
        run: npm run build && npx cap sync android
      # Push notifications: Firebase config is optional. Without it the app builds and simply hides push.
      # Register BOTH app.quizwar.bd and app.quizwar.bd.debug in the Firebase project.
      - name: Firebase config (optional)
        if: ${{ env.HAS_FIREBASE == 'true' }}
        working-directory: quiz-war/apps/android
        run: echo "${{ secrets.QW_GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json
      - name: Debug APK
        working-directory: quiz-war/apps/android
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: quizwar-debug-apk
          path: quiz-war/apps/android/app/build/outputs/apk/debug/*.apk
      # Stable download link for testers: /releases/download/app-latest/QuizWar.apk
      - name: Publish APK release (app-latest)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: quiz-war/apps/android
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/QuizWar.apk"
          gh release delete app-latest -y --cleanup-tag || true
          gh release create app-latest "$RUNNER_TEMP/QuizWar.apk" --target "$GITHUB_SHA" --prerelease \
            --title "QUIZ WAR Android (test build ${QW_VERSION_NAME}-${QW_VERSION_CODE})" \
            --notes "Installable test APK for ${VITE_PUBLIC_WEB_URL}. Built from ${GITHUB_SHA::7}."

      # Signed release bundle — only when the signing secrets are configured.
      # The keystore lives ONLY in GitHub encrypted secrets (base64), never in the repo.
      - name: Signed release AAB
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          QW_KEYSTORE_PASSWORD: ${{ secrets.QW_KEYSTORE_PASSWORD }}
          QW_KEY_ALIAS: ${{ secrets.QW_KEY_ALIAS }}
          QW_KEY_PASSWORD: ${{ secrets.QW_KEY_PASSWORD }}
        working-directory: quiz-war/apps/android
        run: |
          echo "${{ secrets.QW_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          export QW_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          ./gradlew --no-daemon bundleRelease
          rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('quiz-war/apps/android/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: quizwar-release-aab
          path: quiz-war/apps/android/app/build/outputs/bundle/release/*.aab
