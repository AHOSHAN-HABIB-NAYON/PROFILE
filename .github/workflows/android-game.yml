# Builds the "তারা ধরো" Android game and publishes the APK as a GitHub Release,
# so it can be downloaded straight to a phone from the Releases page.
name: Build Android game

on:
  push:
    paths:
      - "android-game/**"
      - ".github/workflows/android-game.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-game
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk tara-dhoro.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tara-dhoro-apk
          path: android-game/tara-dhoro.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: game-v${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: তারা ধরো — গেম v${{ github.run_number }}
          body: |
            নিচের **tara-dhoro.apk** ফাইলটা ফোনে ডাউনলোড করে খুলুন, তারপর Install চাপুন।
          files: android-game/tara-dhoro.apk
          make_latest: true
