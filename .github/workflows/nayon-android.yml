name: NAYON Browser – Android CI

on:
  push:
    paths:
      - "nayon-browser/**"
      - ".github/workflows/nayon-android.yml"
  pull_request:
    paths:
      - "nayon-browser/**"
      - ".github/workflows/nayon-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nayon-android-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: nayon-browser

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      HAS_KEYSTORE: ${{ secrets.NAYON_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit & UI tests (JVM / Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Lint
        run: ./gradlew --stacktrace lintDebug

      - name: Build debug APK
        run: ./gradlew --stacktrace assembleDebug

      # Signed only when the NAYON_* secrets are configured; otherwise an unsigned release APK is produced.
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.NAYON_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/nayon-release.jks"

      - name: Build release APK and App Bundle
        env:
          NAYON_KEYSTORE_PATH: ${{ env.HAS_KEYSTORE == 'true' && format('{0}/nayon-release.jks', runner.temp) || '' }}
          NAYON_KEYSTORE_PASSWORD: ${{ secrets.NAYON_KEYSTORE_PASSWORD }}
          NAYON_KEY_ALIAS: ${{ secrets.NAYON_KEY_ALIAS }}
          NAYON_KEY_PASSWORD: ${{ secrets.NAYON_KEY_PASSWORD }}
        run: ./gradlew --stacktrace assembleRelease bundleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: nayon-browser-apks
          path: |
            nayon-browser/app/build/outputs/apk/debug/*.apk
            nayon-browser/app/build/outputs/apk/release/*.apk
            nayon-browser/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nayon-browser-reports
          path: |
            nayon-browser/app/build/reports/
            nayon-browser/app/build/test-results/
          if-no-files-found: ignore
