name: Delete old build artifacts

# Frees GitHub Actions storage: deletes every stored artifact (the APK/AAB stay on the app-latest release).
on:
  push:
    paths: ['.github/workflows/cleanup-artifacts.yml']
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete all artifacts (one pass)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          ids=$(gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" --jq '.artifacts[].id')
          echo "Found $(echo "$ids" | grep -c . ) artifacts"
          ok=0; bad=0
          for id in $ids; do
            if gh api -X DELETE "repos/$REPO/actions/artifacts/$id" >/dev/null 2>&1; then ok=$((ok+1)); else bad=$((bad+1)); fi
          done
          echo "Deleted $ok, failed $bad"
