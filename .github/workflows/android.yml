# চাকরি সার্কুলার অ্যান্ড্রয়েড অ্যাপ — সাইন করা AAB (Play Store) + APK।
# চাবি শুধু GitHub Secrets-এ থাকে, রিপোতে কখনো না।
name: Android build

on:
  push:
    branches: ['claude/affectionate-clarke-o8xazb']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Decode upload key
        run: |
          echo "${{ secrets.QW_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "QW_KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build signed AAB + APK
        env:
          QW_KEYSTORE_PASSWORD: ${{ secrets.QW_KEYSTORE_PASSWORD }}
          QW_KEY_ALIAS: ${{ secrets.QW_KEY_ALIAS }}
          QW_KEY_PASSWORD: ${{ secrets.QW_KEY_PASSWORD }}
        run: gradle -p android :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Remove key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Save outputs to the branch
        run: |
          rm -rf build-out && mkdir -p build-out
          cp android/app/build/outputs/bundle/release/app-release.aab build-out/CakriCircular-play.aab
          cp android/app/build/outputs/apk/release/app-release.apk build-out/CakriCircular.apk
          ls -la build-out > build-out/info.txt
          echo "source: ${GITHUB_SHA}" >> build-out/info.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-out
          git commit -m "Android build output for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
