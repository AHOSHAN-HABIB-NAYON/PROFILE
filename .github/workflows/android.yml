# চাকরি সার্কুলার অ্যান্ড্রয়েড অ্যাপ — বিল্ড (সাইন ছাড়া)।
# সাইন করা হয় আলাদা জায়গায়, চাবি এই রিপোতে কখনো রাখা হয় না।
name: Android build

on:
  push:
    branches: ['claude/affectionate-clarke-o8xazb']
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Build AAB + APK
        run: gradle -p android :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace

      - name: Save outputs to the branch
        run: |
          mkdir -p build-out
          cp android/app/build/outputs/bundle/release/app-release.aab build-out/app-release-unsigned.aab
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-out/app-release-unsigned.apk
          ls -la build-out > build-out/info.txt
          echo "source: ${GITHUB_SHA}" >> build-out/info.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-out
          git commit -m "Android build output for ${GITHUB_SHA::7} [skip ci]"
          git push origin HEAD:${GITHUB_REF_NAME}
