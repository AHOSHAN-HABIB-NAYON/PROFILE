name: Nirapod CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['nirapod/**', '.github/workflows/nirapod-ci.yml']
  pull_request:
    paths: ['nirapod/**', '.github/workflows/nirapod-ci.yml']
  workflow_dispatch:

concurrency:
  group: nirapod-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (tokens, icons, flags, i18n, navigation, permissions)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nirapod/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: nirapod/tools/package-lock.json }
      - run: npm ci
      - run: node check-all.mjs

  server:
    name: Server tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nirapod_test
          MYSQL_USER: nirapod
          MYSQL_PASSWORD: nirapod
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults: { run: { working-directory: nirapod/server } }
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nirapod_test
      DB_USER: nirapod
      DB_PASSWORD: nirapod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: nirapod/server/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Migrate + seed a fresh database (smoke)
        run: node scripts/migrate.js latest && node scripts/seed.js && node scripts/seed.js

  app:
    name: Android app (analyze, test, build AAB)
    runs-on: ubuntu-latest
    needs: contracts
    defaults: { run: { working-directory: nirapod/app } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.8, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release app bundle
        # Uses the upload key when the ANDROID_KEYSTORE_* secrets exist; otherwise the debug key (not for upload).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi
          flutter build appbundle --release --dart-define=APP_VERSION=0.1.0
      - name: Permission check on the merged release manifest
        run: |
          MERGED=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $MERGED"
          test -n "$MERGED"
          node ../tools/check-permissions.mjs android/app/src/main/AndroidManifest.xml "$MERGED"
      - name: Build installable APK (for testing on a phone)
        run: flutter build apk --release --dart-define=APP_VERSION=0.1.0
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-apk
          path: nirapod/app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-release-aab
          path: nirapod/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
