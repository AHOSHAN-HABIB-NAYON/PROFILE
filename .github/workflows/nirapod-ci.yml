name: Nirapod CI

on:
  push:
    branches: [main, 'claude/**']
    paths: ['nirapod/**', '.github/workflows/nirapod-ci.yml']
  pull_request:
    paths: ['nirapod/**', '.github/workflows/nirapod-ci.yml']
  workflow_dispatch:

concurrency:
  group: nirapod-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  contracts:
    name: Contracts (tokens, icons, flags, i18n, navigation, permissions)
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: nirapod/tools } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: nirapod/tools/package-lock.json }
      - run: npm ci
      - run: node check-all.mjs

  server:
    name: Server tests (MySQL 8)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nirapod_test
          MYSQL_USER: nirapod
          MYSQL_PASSWORD: nirapod
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    defaults: { run: { working-directory: nirapod/server } }
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: nirapod_test
      DB_USER: nirapod
      DB_PASSWORD: nirapod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: nirapod/server/package-lock.json }
      - run: npm ci
      - run: npm test
      - name: Migrate + seed a fresh database (smoke)
        run: node scripts/migrate.js latest && node scripts/seed.js && node scripts/seed.js
      - name: Package the server for Hostinger (nirapod-server.zip)
        # GitHub zips artifacts itself, so upload the unpacked bundle: the downloaded zip then has
        # package.json at its root and can go straight into Hostinger's Node.js upload.
        run: |
          node ../tools/pack-server.mjs
          mkdir -p ../dist/bundle && cd ../dist/bundle && unzip -q ../nirapod-server.zip && test -f package.json
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-server
          path: nirapod/dist/bundle/
          retention-days: 30

  app:
    name: Android app (analyze, test, build AAB)
    runs-on: ubuntu-latest
    needs: contracts
    defaults: { run: { working-directory: nirapod/app } }
    # Google Maps Android key (Maps SDK needs it at build time). Add it as the MAPS_API_KEY repository secret.
    # GOOGLE_SERVER_CLIENT_ID: the "Web application" OAuth client id for Google sign-in (not secret, kept as a secret
    # for one place to manage). Empty = Google button shows an error until it is set.
    env:
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: 3.47.8, channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Build release app bundle
        # Uses the upload key when the ANDROID_KEYSTORE_* secrets exist; otherwise the debug key (not for upload).
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > android/app/upload.jks
            printf "storeFile=upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > android/key.properties
          fi
          flutter build appbundle --release --dart-define=APP_VERSION=0.1.0 --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID --obfuscate --split-debug-info=build/symbols
      - name: Permission check on the merged release manifest
        run: |
          MERGED=$(find build/app/intermediates -path '*release*' -name AndroidManifest.xml | grep -i merged | head -1)
          echo "Merged manifest: $MERGED"
          test -n "$MERGED"
          node ../tools/check-permissions.mjs android/app/src/main/AndroidManifest.xml "$MERGED"
      - name: Build installable APKs (one per phone type, so each is small)
        # Play delivers the right part of the AAB to each phone automatically; for direct installs we build
        # one APK per CPU type instead of one big "universal" APK. Almost all phones today use arm64-v8a.
        run: |
          flutter build apk --release --split-per-abi --target-platform android-arm64,android-arm --dart-define=APP_VERSION=0.1.0 --dart-define=GOOGLE_SERVER_CLIENT_ID=$GOOGLE_SERVER_CLIENT_ID --obfuscate --split-debug-info=build/symbols
          ls -la build/app/outputs/flutter-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-apk
          path: nirapod/app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-apk-old-phones-armv7
          path: nirapod/app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-debug-symbols
          path: nirapod/app/build/symbols
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: nirapod-release-aab
          path: nirapod/app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
