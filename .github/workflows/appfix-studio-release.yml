name: AppFix Studio release

# Builds a signed release APK and AAB when a tag like "appfix-studio-v0.9.0" is pushed.
# Signing material comes only from repository secrets the owner adds:
#   APPFIX_RELEASE_KEYSTORE_BASE64   base64 of the PKCS12/JKS upload keystore
#   APPFIX_RELEASE_STORE_PASSWORD
#   APPFIX_RELEASE_KEY_ALIAS
#   APPFIX_RELEASE_KEY_PASSWORD      (optional; defaults to the store password)
on:
  push:
    tags: ["appfix-studio-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: appfix-studio
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.APPFIX_RELEASE_KEYSTORE_BASE64 }}
          SP: ${{ secrets.APPFIX_RELEASE_STORE_PASSWORD }}
          KA: ${{ secrets.APPFIX_RELEASE_KEY_ALIAS }}
        run: |
          if [ -z "$KS" ] || [ -z "$SP" ] || [ -z "$KA" ]; then
            echo "::error::Release signing secrets are not set. See appfix-studio/docs/RELEASE.md."
            exit 1
          fi

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Test
        run: ./gradlew :core:test :app:testDebugUnitTest :app:lintDebug --stacktrace

      - name: Build signed release APK and AAB
        env:
          KS: ${{ secrets.APPFIX_RELEASE_KEYSTORE_BASE64 }}
          APPFIX_RELEASE_STORE_PASSWORD: ${{ secrets.APPFIX_RELEASE_STORE_PASSWORD }}
          APPFIX_RELEASE_KEY_ALIAS: ${{ secrets.APPFIX_RELEASE_KEY_ALIAS }}
          APPFIX_RELEASE_KEY_PASSWORD: ${{ secrets.APPFIX_RELEASE_KEY_PASSWORD }}
        run: |
          export APPFIX_RELEASE_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KS" | base64 -d > "$APPFIX_RELEASE_KEYSTORE"
          [ -n "$APPFIX_RELEASE_KEY_PASSWORD" ] || unset APPFIX_RELEASE_KEY_PASSWORD
          trap 'rm -f "$APPFIX_RELEASE_KEYSTORE"' EXIT
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify and collect
        run: |
          OUT="$RUNNER_TEMP/release"
          mkdir -p "$OUT"
          VERSION="${GITHUB_REF_NAME#appfix-studio-v}"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk
          cp app/build/outputs/apk/release/app-release.apk "$OUT/AppFixStudio-$VERSION.apk"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT/AppFixStudio-$VERSION.aab"
          cp app/build/outputs/mapping/release/mapping.txt "$OUT/mapping-$VERSION.txt"
          (cd "$OUT" && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - uses: actions/upload-artifact@v4
        with:
          name: appfix-studio-release
          path: ${{ runner.temp }}/release/*

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$RUNNER_TEMP"/release/* \
            --title "AppFix Studio ${GITHUB_REF_NAME#appfix-studio-v}" \
            --notes "Signed release build. Verify downloads against SHA256SUMS.txt. See appfix-studio/README.md for what works and its limitations."
