openapi: 3.1.0
info:
  title: Nirapod API
  version: 0.1.0
  description: |
    Contract for the Nirapod Android app, admin panel and landing page. All endpoints live under /api/v1.
    Implemented: Phase 0 (GET /health, GET /app-config) and every path marked x-phase: 1. Other paths are the
    agreed contract that later phases implement (marked with x-phase). Rate-limited endpoints return 429
    RATE_LIMITED with details.retry_after_s. Validation errors return 400 VALIDATION_FAILED with
    details.fields = { "<field>": "<message>" } (submitted values are never echoed). Errors always use the Error schema with a code from error-codes.md.

    Hard rules reflected here:
    - Admin endpoints (/admin/*) never return coordinates, routes, place names or visited places.
    - Location endpoints are family-scoped and require consent (adult-to-adult visibility only after acceptance).
    - Every auth/code endpoint is rate limited; login locks for 15 minutes after 5 failures.
    - Plan limits are enforced on the server; live location and SOS are never limited by plan.
servers:
  - url: https://api.nirapod.app/api/v1
security:
  - bearer: []

tags:
  - name: system
  - name: auth
  - name: me
  - name: family
  - name: location
  - name: places
  - name: sos
  - name: notifications
  - name: plans
  - name: chat
  - name: admin

paths:
  /health:
    get:
      tags: [system]
      security: []
      x-phase: 0
      summary: Liveness and DB status
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
        '503': { description: Degraded (DB down), content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } }
  /app-config:
    get:
      tags: [system]
      security: []
      x-phase: 0
      summary: Public settings - force update, feature switches, enabled languages, banner switches
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/AppConfig' } } } }
  /geo/hint:
    get:
      tags: [system]
      security: []
      x-phase: 1
      summary: Optional country hint from a LOCAL GeoIP database (GEOIP_DB_PATH, MaxMind .mmdb). The IP is never stored, logged or sent to third parties.
      description: Without a configured database (or on any lookup error) country_iso2 is null. Lowest detection priority (time zone > locale > IP).
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: object, required: [country_iso2], properties: { country_iso2: { type: [string, 'null'], example: BD } } } } } }

  /auth/register:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: auth
      description: |
        Email is trimmed and lowercased. Password rules: at least 8 characters, at least one letter and one number,
        not in the bundled common-password list (10k), at most 72 bytes (bcrypt). A failed rule returns 400
        VALIDATION_FAILED with details.rules = [min_length | max_length | letter | number | common].
        adult_and_terms_confirmed must be true, else 403 CONSENT_REQUIRED (details.needs = age_terms).
        Stores adult_confirmed_at, terms_accepted_at, terms_version and a consents row; emails a 6-digit code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, adult_and_terms_confirmed]
              properties:
                email: { type: string, format: email, maxLength: 254 }
                password: { type: string, minLength: 8, description: 'max 72 bytes UTF-8' }
                adult_and_terms_confirmed: { type: boolean, const: true }
                language: { $ref: '#/components/schemas/LanguageCode' }
                device: { $ref: '#/components/schemas/DeviceInfo' }
      responses:
        '201':
          description: Account created (unverified); verification code sent
          content: { application/json: { schema: { type: object, properties: { email: { type: string }, code_expires_in_s: { type: integer, example: 600 }, resend_after_s: { type: integer, example: 30 } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '409': { description: 'CONFLICT: an account with this email exists', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /auth/verify-email:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: code
      description: |
        6-digit code, 10-minute expiry, only the newest code works. Wrong code -> 400 CODE_INVALID
        (details.attempts_left). 5 wrong attempts -> 423 AUTH_LOCKED for 15 minutes (details.retry_after_s,
        details.locked_until); a resent code does not lift the lock. Expired -> 410 CODE_EXPIRED. Unknown or
        already-verified email -> 400 CODE_INVALID. Success sets email_verified_at, signs in, sends the welcome email.
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [email, code], properties: { email: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' }, device: { $ref: '#/components/schemas/DeviceInfo' } } } } }
      responses:
        '200': { description: Verified and signed in (needs_profile_setup = name is empty), content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/resend-code:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: auth
      description: |
        Allowed 30 s after the last send, max 5 per hour, per email + purpose. The throttle is keyed by the email
        itself, BEFORE any account lookup, so unknown emails get exactly the same 202 / 429 answers (no enumeration).
        429 RATE_LIMITED has details.retry_after_s.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, purpose], properties: { email: { type: string }, purpose: { enum: [verify_email, reset_password] } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { accepted: { const: true }, resend_after_s: { type: integer, example: 30 } } } } } }
        '429': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: auth
      description: |
        Wrong email or password -> 401 AUTH_INVALID_CREDENTIALS (identical for unknown emails). The 5th failure in a
        row locks the account for 15 minutes -> 423 AUTH_LOCKED (details.retry_after_s, details.locked_until), also
        for the right password while locked. Right password but unverified email -> 403 AUTH_EMAIL_NOT_VERIFIED
        (details.code_sent: a new code was emailed if the resend throttle allowed it). Suspended -> 403 FORBIDDEN
        (details.reason = account_suspended). One session per device: logging in again with the same device_id
        replaces that device's previous session. A sign-in from a new device_id emails "New sign-in". No IP is stored.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string }, device: { $ref: '#/components/schemas/DeviceInfo' } } } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/google:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: auth
      description: |
        Server verifies the Google ID token (audience = GOOGLE_OAUTH_CLIENT_IDS) and requires email_verified = true
        (else 403 AUTH_EMAIL_NOT_VERIFIED). Invalid token -> 401 AUTH_INVALID_CREDENTIALS. Not configured -> 503
        FEATURE_DISABLED. Account resolution: by google_sub, else by the same email (linked; an UNVERIFIED email
        account loses its unproven password and sessions), else a new account, which requires
        adult_and_terms_confirmed=true (else 403 CONSENT_REQUIRED, details.needs = age_terms; nothing is created).
        Name and photo are prefilled from Google (photo = Google https URL). New accounts get needs_profile_setup=true.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [id_token], properties: { id_token: { type: string }, adult_and_terms_confirmed: { type: boolean }, language: { $ref: '#/components/schemas/LanguageCode' }, device: { $ref: '#/components/schemas/DeviceInfo' } } } } } }
      responses:
        '200': { description: Signed in, content: { application/json: { schema: { allOf: [ { $ref: '#/components/schemas/Session' }, { type: object, required: [is_new_account], properties: { is_new_account: { type: boolean } } } ] } } } }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /auth/child:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: code
      description: |
        Child joins with a 6-character family code (alphabet ABCDEFGHJKMNPQRSTUVWXYZ23456789; input is uppercased,
        spaces/dashes removed). Unknown, used or revoked -> 400 CODE_INVALID; older than 24 h -> 410 CODE_EXPIRED;
        family at its plan's max_children -> 402 PLAN_LIMIT_REACHED. Creates a user (auth_provider device, no email or
        password), a child family member (sharing_status active), a child_devices row bound to device.device_id and a
        child session. The refresh token only works with header `x-device-id: <device.device_id>`.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [code, first_name, device], properties: { code: { type: string, pattern: '^[ABCDEFGHJKMNPQRSTUVWXYZ23456789]{6}$' }, first_name: { type: string, minLength: 1, maxLength: 60 }, device: { allOf: [ { $ref: '#/components/schemas/DeviceInfo' }, { required: [device_id] } ] }, timezone: { type: string, description: IANA, validated }, country_iso2: { type: string, description: ISO 3166-1 alpha-2, validated }, language: { $ref: '#/components/schemas/LanguageCode' } } } } } }
      responses:
        '200': { description: Child session (user.role = child, needs_profile_setup = false), content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
  /auth/refresh:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: refresh
      description: |
        Rotating refresh token: every call returns a NEW refresh token; the old one stops working. Presenting an old
        (rotated) token revokes the whole rotation_family -> 401 AUTH_REFRESH_INVALID. Revoked/expired session,
        suspended user (details.reason = account_suspended) or, for child sessions, a missing/different x-device-id
        header (details.reason = device_mismatch) -> 401 AUTH_REFRESH_INVALID. Each refresh extends the session by
        REFRESH_TTL_DAYS. The session id (sid) stays the same.
      parameters:
        - { name: x-device-id, in: header, required: false, schema: { type: string }, description: 'Required for child sessions: the device_id the child joined with' }
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } } }
      responses:
        '200': { description: New pair, content: { application/json: { schema: { $ref: '#/components/schemas/TokenPair' } } } }
        '401': { $ref: '#/components/responses/Error' }
  /auth/forgot:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: auth
      description: Always 202 with the same body ("If this email exists, we sent a code"); throttled requests (30 s / 5 per hour) are silently not sent.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        '202': { description: Accepted, content: { application/json: { schema: { type: object, properties: { accepted: { const: true } } } } } }
  /auth/reset:
    post:
      tags: [auth]
      security: []
      x-phase: 1
      x-rate-limit: code
      description: |
        Same code rules as verify-email (CODE_INVALID with attempts_left, CODE_EXPIRED, AUTH_LOCKED). Same password
        rules as register (VALIDATION_FAILED, details.rules). Success revokes ALL sessions of the user, clears the
        login lock and marks the email verified (the code proves ownership).
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [email, code, new_password], properties: { email: { type: string }, code: { type: string, pattern: '^[0-9]{6}$' }, new_password: { type: string, minLength: 8 } } } } } }
      responses:
        '204': { description: Password changed; all sessions revoked (log in again) }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }
        '423': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      x-phase: 1
      description: Revokes the current session (its refresh token stops working) and clears its FCM token.
      responses:
        '204': { description: Signed out }
        '401': { $ref: '#/components/responses/Error' }
  /auth/change-password:
    post:
      tags: [auth]
      x-phase: 2
      summary: Change password while signed in (email accounts); other sessions are signed out
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [current_password, new_password], properties: { current_password: { type: string }, new_password: { type: string, minLength: 8 } } } } } }
      responses:
        '200': { description: Changed, content: { application/json: { schema: { type: object, properties: { other_sessions_signed_out: { type: integer } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/sessions:
    get:
      tags: [auth]
      x-phase: 1
      summary: Active sessions of the caller (one per device)
      responses:
        '200': { description: Sessions, newest use first, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/SessionInfo' } } } } }
  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      x-phase: 1
      summary: Remote sign-out (own sessions only; another user's session id -> 404 NOT_FOUND)
      parameters: [ { name: sessionId, in: path, required: true, schema: { type: string, format: uuid } } ]
      responses:
        '204': { description: Revoked }
        '404': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [me]
      x-phase: 1
      responses:
        '200': { description: Current user, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
    delete:
      tags: [me]
      x-phase: 7
      summary: Delete my account and data (owner must transfer or delete the family first)
      responses:
        '202': { description: Deletion request created (data_requests) }
  /me/profile:
    patch:
      tags: [me]
      x-phase: 1
      description: |
        Partial update; at least one field; unknown fields -> 400. name: trimmed, 1-60 characters (code points, any
        script, emoji allowed, no control characters). country_iso2: ISO 3166 (case-insensitive, stored uppercase) or
        null. timezone: IANA zone from the server's zone.tab list (UTC/GMT/Etc allowed) or null. Role cannot be set.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                country_iso2: { type: [string, 'null'], pattern: '^[A-Za-z]{2}$' }
                timezone: { type: [string, 'null'], example: Asia/Dhaka }
                tz_auto: { type: boolean }
                detected_source: { enum: [timezone, locale, ip, manual, null] }
                language: { $ref: '#/components/schemas/LanguageCode' }
      responses:
        '200': { description: Updated, content: { application/json: { schema: { $ref: '#/components/schemas/Me' } } } }
        '400': { $ref: '#/components/responses/Error' }
  /me/photo:
    post:
      tags: [me]
      x-phase: 1
      x-rate-limit: '10 per hour per user'
      description: |
        Multipart field `photo`, max 10 MB (413 PAYLOAD_TOO_LARGE). Type is decided by magic bytes (JPEG, PNG, WebP,
        HEIC/HEIF), never by the declared type; anything else or an undecodable file -> 415 UNSUPPORTED_MEDIA. If the
        server cannot decode HEIC -> 415 with details.reason = heic_unsupported (the app converts to JPEG first).
        Auto-rotated by EXIF, re-encoded to 512x512 and 128x128 JPEG with ALL metadata removed, random file names.
        The previous photo files are deleted. Files are served read-only at /media/avatars/<uuid>.jpg (nosniff).
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [photo], properties: { photo: { type: string, format: binary } } } } } }
      responses:
        '200': { description: Stored, content: { application/json: { schema: { type: object, properties: { avatar_url: { type: string, example: 'https://api.nirapod.app/media/avatars/1b4e28ba-2fa1-11d2-883f-0016d3cca427.jpg' }, avatar_thumb_url: { type: string } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
    delete:
      tags: [me]
      x-phase: 1
      description: Removes the photo (files deleted, avatar_url and avatar_thumb_url become null).
      responses:
        '204': { description: Removed }
  /me/consents:
    post:
      tags: [me]
      x-phase: 1
      summary: Store a consent record (child consent screen, background-location disclosure, 18+ terms, AI notice)
      description: details may hold ids and flags only (keys that look like coordinates or personal data are rejected), max 2 KB. Linked to the caller's family if any.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, version, granted]
              additionalProperties: false
              properties:
                type: { enum: [age_18_terms_privacy, child_location_sharing, adult_location_sharing, background_location_disclosure, ai_chat_notice, email_marketing] }
                version: { type: string, maxLength: 20, example: '2026-10' }
                granted: { type: boolean }
                details: { type: object, description: 'e.g. { "shown_member_ids": [...] } - never coordinates' }
      responses:
        '201': { description: Stored, content: { application/json: { schema: { type: object, properties: { type: { type: string }, version: { type: string }, granted: { type: boolean }, created_at: { type: string, format: date-time } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /me/fcm-token:
    put:
      tags: [me]
      x-phase: 5
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [token], properties: { token: { type: string } } } } } }
      responses:
        '204': { description: Saved for this session }
  /me/export:
    post:
      tags: [me]
      x-phase: 7
      responses:
        '202': { description: Export request created (data_requests) }

  /families:
    post:
      tags: [family]
      x-phase: 1
      summary: Create a family (caller becomes owner and parent; sharing_status starts pending - adult consent rule)
      description: Adults only (child sessions -> 403). One family per user for now -> 409 CONFLICT if already a member.
      requestBody: { content: { application/json: { schema: { type: object, properties: { name: { type: string, minLength: 1, maxLength: 120 } } } } } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Family' } } } }
        '403': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /families/{familyId}:
    get:
      tags: [family]
      x-phase: 1
      description: Members only (others, or a malformed id -> 404 NOT_FOUND). Members with name, avatar, role, relationship, local-time fields. Never locations.
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      responses:
        '200': { description: Family with members, content: { application/json: { schema: { $ref: '#/components/schemas/Family' } } } }
        '404': { $ref: '#/components/responses/Error' }
  /families/{familyId}/child-code:
    post:
      tags: [family]
      x-phase: 1
      x-rate-limit: code
      summary: Generate/regenerate the child code (24 h, single use). The previous unused code is revoked.
      description: |
        Parents/guardians of the family only (child -> 403, non-member -> 404). If the family already has its plan's
        max_children active children -> 402 PLAN_LIMIT_REACHED with details { limit: max_children, max, current, plan }.
        Plan = the family's active/trial/grace subscription, else 'free'.
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      responses:
        '201': { description: Code, content: { application/json: { schema: { type: object, required: [code, expires_at, join_url], properties: { code: { type: string, example: K7Q2MX }, expires_at: { type: string, format: date-time }, join_url: { type: string, example: 'https://nirapod.app/join?code=K7Q2MX' } } } } } }
        '402': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /families/{familyId}/invites:
    post:
      tags: [family]
      x-phase: 2
      summary: Invite an adult by email or 6-character code (guardian, optional overseas flag)
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { email: { type: string }, role: { enum: [parent, guardian] }, is_overseas: { type: boolean }, timezone: { type: string } } } } } }
      responses:
        '201': { description: 'Invite created: {code, role, is_overseas, expires_at (7 days), invite_url, email_sent}' }
        '402': { $ref: '#/components/responses/Error' }
  /invites/accept:
    post:
      tags: [family]
      x-phase: 1
      x-rate-limit: code
      description: |
        Adults only (child -> 403). Code is uppercased. Unknown, used, revoked, or bound to a different email ->
        400 CODE_INVALID; expired -> 410 CODE_EXPIRED; caller already in a family -> 409 CONFLICT; family at its plan's
        max_members adults (parents + guardians) -> 402 PLAN_LIMIT_REACHED (details.limit = max_members).
        Joins as the invite's role; sharing_status starts pending until the adult accepts (adult consent rule).
      requestBody: { content: { application/json: { schema: { type: object, required: [code], properties: { code: { type: string, example: K7Q2MX } } } } } }
      responses:
        '200': { description: Joined, content: { application/json: { schema: { type: object, properties: { role: { enum: [parent, guardian] }, sharing_status: { const: pending }, family: { $ref: '#/components/schemas/Family' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
        '402': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /families/{familyId}/members/{memberId}:
    patch:
      tags: [family]
      x-phase: 2
      summary: Change sharing (adult pauses/stops own sharing; accept consent), relationship, overseas flag
      parameters: [ { $ref: '#/components/parameters/familyId' }, { $ref: '#/components/parameters/memberId' } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { sharing_status: { enum: [active, paused, stopped] }, relationship: { type: string }, daily_summary_enabled: { type: boolean }, daily_summary_time: { type: string, pattern: '^[0-2][0-9]:[0-5][0-9]$' } } } } } }
      responses:
        '200': { description: Updated }
    delete:
      tags: [family]
      x-phase: 2
      summary: Remove a member / child device, or leave the family
      parameters: [ { $ref: '#/components/parameters/familyId' }, { $ref: '#/components/parameters/memberId' } ]
      responses:
        '204': { description: Removed }
  /families/{familyId}/transfer:
    post:
      tags: [family]
      x-phase: 2
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      requestBody: { content: { application/json: { schema: { type: object, required: [new_owner_member_id], properties: { new_owner_member_id: { type: string } } } } } }
      responses:
        '200': { description: Ownership transferred }

  /locations:
    post:
      tags: [location]
      x-phase: 3
      summary: Batch upload from a device (offline queue). Coordinates are never logged.
      requestBody: { content: { application/json: { schema: { type: object, required: [points], properties: { points: { type: array, maxItems: 200, items: { $ref: '#/components/schemas/LocationPoint' } }, device_state: { $ref: '#/components/schemas/DeviceDiagnostics' } } } } } }
      description: 'Adults must have sharing_status active (else 403 CONSENT_REQUIRED). Points older than 7 days or >2 min in the future are dropped. Response {accepted, dropped, update_requested: {by_name}|null}. Auth: Bearer access token or `Device <upload_key>` + x-device-id. Body may carry only device_state (points empty) to report location off / permission removed.'
      responses:
        '202': { description: Accepted }
  /devices/upload-key:
    post:
      tags: [location]
      x-phase: 3
      summary: Child session creates/rotates a device-scoped upload key for the native background service
      description: 'Use as `Authorization: Device <upload_key>` + `x-device-id` on POST /locations only. Revoked when the child device is removed.'
      responses:
        '201': { description: '{upload_key}' }
        '403': { $ref: '#/components/responses/Error' }
  /families/{familyId}/live:
    get:
      tags: [location]
      x-phase: 2
      summary: Latest position per visible member with trust inputs (exact last update, accuracy, reason if unavailable)
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      responses:
        '200': { description: OK, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/MemberLocation' } } } } }
  /families/{familyId}/members/{memberId}/route:
    get:
      tags: [location]
      x-phase: 3
      summary: Route for one day (limited by plan history_days)
      parameters: [ { $ref: '#/components/parameters/familyId' }, { $ref: '#/components/parameters/memberId' }, { name: date, in: query, required: true, schema: { type: string, format: date } } ]
      description: 'Day in the member saved zone. Response {member_id, date, timezone, history_days, points: [{recorded_at, lat, lng, accuracy_m, battery_pct}]}. Older than plan history_days -> 402 PLAN_LIMIT_REACHED (details.limit=history_days).'
      responses:
        '200': { description: Points for the day }
        '402': { $ref: '#/components/responses/Error' }
  /families/{familyId}/timeline:
    get:
      tags: [location]
      x-phase: 3
      parameters: [ { $ref: '#/components/parameters/familyId' }, { name: before, in: query, schema: { type: string, format: date-time } } ]
      description: 'Query: before, limit (<=100), category safety|family. Items {id, type, member_id, member_name, occurred_at, data}. Only members the caller may see; within the plan history window.'
      responses:
        '200': { description: Arrivals, departures, SOS, battery and offline events }
  /families/{familyId}/members/{memberId}/request-update:
    post:
      tags: [location]
      x-phase: 2
      x-rate-limit: '1 per 2 minutes per member'
      summary: High-priority push wakes the child's service; the child sees "<name> requested your location"
      parameters: [ { $ref: '#/components/parameters/familyId' }, { $ref: '#/components/parameters/memberId' } ]
      responses:
        '202': { description: Requested }
  /nearby:
    get:
      tags: [location]
      x-phase: 2
      summary: Nearby places via Places API (New), cached per grid cell for 24 h, per-user and daily caps, admin switch
      parameters: [ { name: lat, in: query, required: true, schema: { type: number } }, { name: lng, in: query, required: true, schema: { type: number } }, { name: categories, in: query, schema: { type: string, example: 'school,hospital,police,pharmacy,mosque,store' } } ]
      description: 'Response {places: [{id, name, category, lat, lng, address, distance_m}], fetched}. Google is queried with the ~1 km grid-cell centre, never the exact position.'
      responses:
        '200': { description: Places with distance }
        '503': { $ref: '#/components/responses/Error' }

  /families/{familyId}/places:
    get:
      tags: [places]
      x-phase: 4
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      responses:
        '200': { description: Places, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Place' } } } } }
    post:
      tags: [places]
      x-phase: 4
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/Place' } } } }
      responses:
        '201': { description: Created }
        '402': { $ref: '#/components/responses/Error' }
  /families/{familyId}/places/{placeId}:
    patch:
      tags: [places]
      x-phase: 4
      parameters: [ { $ref: '#/components/parameters/familyId' }, { name: placeId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Updated } }
    delete:
      tags: [places]
      x-phase: 4
      parameters: [ { $ref: '#/components/parameters/familyId' }, { name: placeId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Deleted } }

  /sos:
    post:
      tags: [sos]
      x-phase: 4
      summary: Start SOS after the 5-second countdown. Never blocked by plan.
      requestBody: { content: { application/json: { schema: { type: object, required: [trigger], properties: { trigger: { enum: [button, shake] }, point: { $ref: '#/components/schemas/LocationPoint' } } } } } }
      responses:
        '201': { description: SOS event with per-recipient deliveries, content: { application/json: { schema: { $ref: '#/components/schemas/SosEvent' } } } }
  /sos/{sosId}:
    get:
      tags: [sos]
      x-phase: 4
      parameters: [ { name: sosId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Status, content: { application/json: { schema: { $ref: '#/components/schemas/SosEvent' } } } } }
  /sos/{sosId}/respond:
    post:
      tags: [sos]
      x-phase: 4
      parameters: [ { name: sosId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Marked responded } }
  /sos/{sosId}/resolve:
    post:
      tags: [sos]
      x-phase: 4
      parameters: [ { name: sosId, in: path, required: true, schema: { type: string } } ]
      responses: { '204': { description: Resolved } }
  /safe-arrival:
    post:
      tags: [sos]
      x-phase: 4
      summary: '"I arrived safely": name, time and place to the family'
      responses: { '202': { description: Sent } }
  /trips:
    post:
      tags: [sos]
      x-phase: 4
      summary: Safe walk home (Heading home) with expected arrival time
      requestBody: { content: { application/json: { schema: { type: object, required: [expected_arrival_at], properties: { expected_arrival_at: { type: string, format: date-time }, destination_place_id: { type: string } } } } } }
      responses: { '201': { description: Trip started } }
  /trips/{tripId}:
    patch:
      tags: [sos]
      x-phase: 4
      parameters: [ { name: tripId, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { application/json: { schema: { type: object, properties: { status: { enum: [arrived, cancelled] } } } } } }
      responses: { '200': { description: Updated } }

  /notifications:
    get:
      tags: [notifications]
      x-phase: 5
      parameters: [ { name: category, in: query, schema: { enum: [safety, family, account] } }, { name: before, in: query, schema: { type: string, format: date-time } } ]
      responses: { '200': { description: Alerts list with unread count } }
  /notifications/read:
    post:
      tags: [notifications]
      x-phase: 5
      responses: { '204': { description: Marked read } }
  /notification-settings:
    get: { tags: [notifications], x-phase: 5, responses: { '200': { description: Per-type push and email toggles } } }
    patch: { tags: [notifications], x-phase: 5, responses: { '200': { description: Updated } } }

  /plans:
    get:
      tags: [plans]
      security: []
      x-phase: 6
      summary: Active plans with prices for the caller's country (from the saved country or ?country=)
      parameters: [ { name: country, in: query, schema: { type: string } } ]
      responses: { '200': { description: Plans, content: { application/json: { schema: { type: array, items: { $ref: '#/components/schemas/Plan' } } } } } }
  /families/{familyId}/subscription:
    get:
      tags: [plans]
      x-phase: 6
      parameters: [ { $ref: '#/components/parameters/familyId' } ]
      responses: { '200': { description: Current plan, expiry, limits and usage, gift banner if any } }
  /billing/play/verify:
    post:
      tags: [plans]
      x-phase: 6
      summary: Verify a Google Play purchase token server-side (Play Developer API)
      requestBody: { content: { application/json: { schema: { type: object, required: [purchase_token, product_id, family_id], properties: { purchase_token: { type: string }, product_id: { type: string }, family_id: { type: string } } } } } }
      responses: { '200': { description: Subscription activated for the whole family } }
  /billing/play/rtdn:
    post:
      tags: [plans]
      security: []
      x-phase: 6
      summary: Real-time developer notifications (Pub/Sub push, verified) for renew/cancel/refund/grace
      responses: { '204': { description: Processed } }
  /redeem:
    post:
      tags: [plans]
      x-phase: 6
      x-rate-limit: code
      requestBody: { content: { application/json: { schema: { type: object, required: [code, family_id], properties: { code: { type: string }, family_id: { type: string } } } } } }
      responses:
        '200': { description: Redeemed; gift info if present }
        '400': { $ref: '#/components/responses/Error' }
        '410': { $ref: '#/components/responses/Error' }

  /chat/conversations:
    post:
      tags: [chat]
      x-phase: 7
      summary: Start (or resume the open) conversation. Adults only; child sessions get FORBIDDEN.
      responses: { '201': { description: Conversation } }
  /chat/conversations/{conversationId}/messages:
    get:
      tags: [chat]
      x-phase: 7
      parameters: [ { name: conversationId, in: path, required: true, schema: { type: string } } ]
      responses: { '200': { description: Messages (closed conversations return 404 to the user) } }
    post:
      tags: [chat]
      x-phase: 7
      x-rate-limit: chat
      parameters: [ { name: conversationId, in: path, required: true, schema: { type: string } } ]
      requestBody: { content: { multipart/form-data: { schema: { type: object, properties: { body: { type: string, maxLength: 2000 }, image: { type: string, format: binary } } } } } }
      responses: { '201': { description: Message stored } }
  /chat/conversations/{conversationId}/escalate:
    post: { tags: [chat], x-phase: 7, parameters: [ { name: conversationId, in: path, required: true, schema: { type: string } } ], responses: { '204': { description: Marked needs human } } }
  /chat/conversations/{conversationId}/close:
    post: { tags: [chat], x-phase: 7, parameters: [ { name: conversationId, in: path, required: true, schema: { type: string } } ], responses: { '204': { description: Closed; disappears from the user side } } }
  /chat/conversations/{conversationId}/rating:
    post: { tags: [chat], x-phase: 7, parameters: [ { name: conversationId, in: path, required: true, schema: { type: string } } ], responses: { '204': { description: Rated } } }

  /abuse-reports:
    post:
      tags: [me]
      x-phase: 2
      requestBody: { content: { application/json: { schema: { type: object, required: [category], properties: { category: { enum: [covert_tracking, harassment, unwanted_sharing, other] }, details: { type: string, maxLength: 2000 }, reported_member_id: { type: string } } } } } }
      responses: { '201': { description: Report created } }

  /admin/*:
    get:
      tags: [admin]
      x-phase: 8
      summary: Admin panel API (session cookie + CSRF token + 2FA). Detailed in Phase 8.
      description: |
        Served with the admin DB user, which has NO grants on locations, places, trips, sos_events,
        timeline_events or nearby_cache. Customer context returns diagnostics only (no coordinates,
        routes, place names or last known position). Every write is audit-logged with the agent name.
      responses: { '200': { description: OK } }

  # ---------------- Phase 4: places and safety ----------------
  /families/{familyId}/places:
    x-phase: 4
    get: { summary: Places (child sees the ones that apply to them), tags: [places], responses: { '200': { description: '{places[], max_places, plan}' } } }
    post: { summary: Add a place (adults; plan limit -> 402 PLAN_LIMIT_REACHED), tags: [places], responses: { '201': { description: Place } } }
  /families/{familyId}/places/{placeId}:
    x-phase: 4
    patch: { summary: Edit a place (moving it resets the inside/outside state), tags: [places], responses: { '200': { description: Place } } }
    delete: { summary: Delete a place, tags: [places], responses: { '204': { description: Deleted } } }
  /families/{familyId}/emergency-contacts:
    x-phase: 4
    get: { summary: Emergency contacts (email only), tags: [safety], responses: { '200': { description: list } } }
    post: { summary: Add a contact (max 5), tags: [safety], responses: { '201': { description: contact } } }
  /families/{familyId}/emergency-contacts/{contactId}:
    x-phase: 4
    delete: { summary: Remove a contact, tags: [safety], responses: { '204': { description: Deleted } } }
  /emergency-numbers:
    x-phase: 4
    get: { summary: Emergency service numbers for a country (admin-editable table), tags: [safety], responses: { '200': { description: '{country, numbers[]}' } } }
  /sos:
    x-phase: 4
    post: { summary: Send SOS (user token or Device key for shake-to-SOS); one open SOS per person, tags: [safety], responses: { '201': { description: SOS with deliveries }, '200': { description: Already open } } }
  /sos/{sosId}:
    x-phase: 4
    get: { summary: SOS with per-recipient delivery status (sender and family adults), tags: [safety], responses: { '200': { description: SOS } } }
  /sos/{sosId}/ack:
    x-phase: 4
    post: { summary: 'Recipient reports delivered / seen / responded (forward only)', tags: [safety], responses: { '200': { description: SOS } } }
  /sos/{sosId}/resolve:
    x-phase: 4
    post: { summary: End the SOS (sender or an adult), tags: [safety], responses: { '200': { description: SOS } } }
  /families/{familyId}/sos:
    x-phase: 4
    get: { summary: Open SOS events (adults see all; a child sees their own), tags: [safety], responses: { '200': { description: list } } }
  /safe-arrival:
    x-phase: 4
    post: { summary: '"I arrived safely" (names the place the sender is at)', tags: [safety], responses: { '201': { description: '{sent, place, at}' } } }
  /trips:
    x-phase: 4
    post: { summary: 'Start a safe walk {minutes | expected_arrival_at, destination_place_id?}', tags: [safety], responses: { '201': { description: Trip } } }
  /trips/active:
    x-phase: 4
    get: { summary: My active safe walk or null, tags: [safety], responses: { '200': { description: Trip or null } } }
  /families/{familyId}/trips:
    x-phase: 4
    get: { summary: Active safe walks (adults all; child own), tags: [safety], responses: { '200': { description: list } } }
  /trips/{tripId}/arrive:
    x-phase: 4
    post: { summary: I arrived (walker only), tags: [safety], responses: { '200': { description: Trip } } }
  /trips/{tripId}/cancel:
    x-phase: 4
    post: { summary: End a safe walk (walker or adult), tags: [safety], responses: { '200': { description: Trip } } }
  # ---------------- Phase 5: notifications ----------------
  /notifications:
    x-phase: 5
    get: { summary: 'Alerts list (bell) with category filter and unread count', tags: [notifications], responses: { '200': { description: '{unread, items[]}' } } }
  /notifications/read:
    x-phase: 5
    post: { summary: 'Mark read {ids[] | all}', tags: [notifications], responses: { '200': { description: '{updated}' } } }
  /me/push-token:
    x-phase: 5
    post: { summary: 'Set (or clear with null) the FCM token of this session', tags: [notifications], responses: { '204': { description: Saved } } }
  /me/notification-prefs:
    x-phase: 5
    get: { summary: Push categories and email types on/off, daily summary hour, tags: [notifications], responses: { '200': { description: prefs } } }
    patch: { summary: Change preferences (safety push is always on), tags: [notifications], responses: { '200': { description: prefs } } }

  # ---------------- Phase 6: plans and payments ----------------
  /plans:
    x-phase: 6
    get: { summary: 'Active plans with local prices (?country) + current family plan, trial use and gift banner when signed in', tags: [billing], security: [], responses: { '200': { description: '{country, plans[], current, gift}' } } }
  /billing/trial:
    x-phase: 6
    post: { summary: 'Start the free trial once per family {plan_code}', tags: [billing], responses: { '201': { description: '{plan, status, expires_at}' }, '409': { description: Trial already used } } }
  /billing/play/verify:
    x-phase: 6
    post: { summary: 'Verify a Google Play purchase server-side {product_id, purchase_token, kind} and grant the plan to the family', tags: [billing], responses: { '200': { description: '{plan, status, expires_at}' } } }
  /billing/play/rtdn:
    x-phase: 6
    post: { summary: 'Play real-time developer notifications (Pub/Sub push, ?token= shared secret set in admin)', tags: [billing], security: [], responses: { '204': { description: Accepted } } }
  /redeem:
    x-phase: 6
    post: { summary: 'Redeem a single-use code {code} (rate limited; gift message shown to the family)', tags: [billing], responses: { '200': { description: '{plan, expires_at, gift}' } } }
  /changelog:
    x-phase: 6
    get: { summary: 'Published "App updates" for the landing page (?language)', tags: [content], security: [], responses: { '200': { description: list } } }

components:
  securitySchemes:
    bearer: { type: http, scheme: bearer, bearerFormat: JWT, description: 'Short-lived access token (15 min). Refresh with /auth/refresh.' }
  parameters:
    familyId: { name: familyId, in: path, required: true, schema: { type: string, format: uuid } }
    memberId: { name: memberId, in: path, required: true, schema: { type: string, format: uuid } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string, description: 'See error-codes.md', example: AUTH_INVALID_CREDENTIALS }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
    Health:
      type: object
      properties:
        status: { enum: [ok, degraded] }
        version: { type: string }
        db: { enum: [ok, down] }
        uptime_s: { type: integer }
        time: { type: string, format: date-time }
    LanguageCode: { enum: [en, bn, hi, ur, ar, es, id, ms] }
    AppConfig:
      type: object
      properties:
        min_version: { type: string }
        latest_version: { type: string }
        update_message: { type: object, additionalProperties: { type: string } }
        play_store_url: { type: string }
        languages_enabled: { type: object, additionalProperties: { type: boolean } }
        free_plan_enabled: { type: boolean }
        trial_days: { type: integer }
        whatsapp_number: { type: string }
        payment_banner_enabled: { type: boolean, default: false }
        payment_banner_show_logos: { type: boolean, default: false }
        payment_banner_countries: { type: array, items: { type: string } }
        payment_banner_text: { type: object, additionalProperties: { type: string } }
        payment_banner_logos: { type: array, items: { type: string }, description: Admin-uploaded logo paths for the scrolling strip }
        landing_ai_chat_enabled: { type: boolean, description: Landing page AI help chat switch }
        nearby_places_enabled: { type: boolean }
        live_chat_human_for: { enum: [all, premium] }
        firebase_android:
          type: object
          description: Firebase client identifiers (public), set in admin. The app initializes FCM with these at runtime.
          properties: { api_key: { type: string }, app_id: { type: string }, project_id: { type: string }, sender_id: { type: string } }
    DeviceInfo:
      type: object
      properties:
        device_id: { type: string, maxLength: 64 }
        model: { type: string }
        manufacturer: { type: string }
        os_version: { type: string }
        app_version: { type: string }
    TokenPair:
      type: object
      required: [access_token, refresh_token, token_type, expires_in]
      properties:
        access_token: { type: string, description: 'HS256 JWT; sub = user id, sid = session id' }
        refresh_token: { type: string, description: 'Opaque; rotated on every /auth/refresh' }
        token_type: { const: Bearer }
        expires_in: { type: integer, example: 900 }
    Session:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [session_id, user, needs_profile_setup]
          properties:
            session_id: { type: string, format: uuid }
            user: { $ref: '#/components/schemas/Me' }
            needs_profile_setup: { type: boolean, description: 'true when the name is empty (and for a new Google account)' }
    SessionInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        device_model: { type: [string, 'null'] }
        os_version: { type: [string, 'null'] }
        app_version: { type: [string, 'null'] }
        is_child_device: { type: boolean }
        created_at: { type: string, format: date-time }
        last_used_at: { type: [string, 'null'], format: date-time }
        current: { type: boolean }
    Me:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: [string, 'null'] }
        email_verified: { type: boolean }
        auth_provider: { enum: [email, google, device] }
        has_password: { type: boolean, description: 'false for Google-only and child accounts (hide "Change password")' }
        name: { type: [string, 'null'] }
        avatar_url: { type: [string, 'null'], description: 'absolute URL (our /media/avatars/... or a Google photo URL)' }
        avatar_thumb_url: { type: [string, 'null'] }
        country_iso2: { type: [string, 'null'] }
        timezone: { type: [string, 'null'] }
        tz_auto: { type: boolean }
        detected_source: { enum: [timezone, locale, ip, manual, null] }
        language: { $ref: '#/components/schemas/LanguageCode' }
        role: { enum: [parent, guardian, child, null], description: 'Decided by the server from family membership' }
        is_overseas: { type: boolean }
        family_id: { type: [string, 'null'] }
    Family:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        owner_member_id: { type: string }
        plan: { type: string }
        members: { type: array, items: { $ref: '#/components/schemas/Member' } }
    Member:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        avatar_thumb_url: { type: [string, 'null'] }
        role: { enum: [parent, guardian, child] }
        relationship: { type: [string, 'null'] }
        is_overseas: { type: boolean }
        timezone: { type: [string, 'null'], description: 'Used to show each member''s own local time' }
        country_iso2: { type: [string, 'null'] }
        sharing_status: { enum: [pending, active, paused, stopped] }
    LocationPoint:
      type: object
      required: [recorded_at, lat, lng, accuracy_m]
      properties:
        recorded_at: { type: string, format: date-time }
        lat: { type: number, minimum: -90, maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }
        accuracy_m: { type: number, minimum: 0 }
        speed_mps: { type: number }
        heading_deg: { type: number }
        battery_pct: { type: integer, minimum: 0, maximum: 100 }
        is_moving: { type: boolean }
    DeviceDiagnostics:
      type: object
      properties:
        notifications_allowed: { type: boolean }
        location_allowed: { type: boolean }
        background_allowed: { type: boolean }
        battery_optimization_on: { type: boolean }
        location_services_on: { type: boolean }
        battery_saver_on: { type: boolean }
    MemberLocation:
      type: object
      properties:
        member_id: { type: string }
        point: { oneOf: [ { $ref: '#/components/schemas/LocationPoint' }, { type: 'null' } ] }
        last_update_at: { type: [string, 'null'], format: date-time, description: 'Exact time of the last point (trust label input)' }
        place_name: { type: [string, 'null'] }
        battery_pct: { type: [integer, 'null'] }
        online: { type: boolean }
        unavailable_reason: { enum: [phone_off, location_off, permission_removed, battery_saver, no_network, no_data, null] }
    Place:
      type: object
      required: [name, type, lat, lng, radius_m]
      properties:
        id: { type: string }
        name: { type: string, maxLength: 80 }
        type: { enum: [home, school, coaching, custom] }
        lat: { type: number }
        lng: { type: number }
        radius_m: { type: integer, minimum: 100, maximum: 300 }
        applies_to: { type: [array, 'null'], items: { type: string }, description: 'member ids; null = all children' }
    SosEvent:
      type: object
      properties:
        id: { type: string }
        status: { enum: [sending, active, resolved, cancelled] }
        started_at: { type: string, format: date-time }
        deliveries:
          type: array
          items:
            type: object
            properties:
              recipient_name: { type: string }
              channel: { enum: [push, email, socket] }
              status: { enum: [queued, sent, delivered, seen, responded, failed] }
    Plan:
      type: object
      properties:
        code: { type: string }
        name: { type: string }
        max_children: { type: [integer, 'null'] }
        max_members: { type: [integer, 'null'] }
        max_places: { type: [integer, 'null'] }
        history_days: { type: integer }
        features: { type: array, items: { type: string } }
        is_popular: { type: boolean }
        trial_days: { type: integer }
        prices:
          type: array
          items:
            type: object
            properties:
              period: { enum: [monthly, yearly, one_time, multi_year] }
              duration_months: { type: integer }
              currency: { type: string }
              amount_minor: { type: integer }
              per_month_minor: { type: integer }
              play_product_id: { type: string }
              play_base_plan_id: { type: string }
