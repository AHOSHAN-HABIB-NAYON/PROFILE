name: nirapod
description: "Nirapod: Live Family Locator"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  go_router: ^18.1.1
  flutter_riverpod: ^3.4.3
  dio: ^5.11.1
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  flutter_svg: ^2.3.0
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  flutter_displaymode: ^0.7.0
  connectivity_plus: ^7.3.2
  intl: ^0.20.3
  flutter_localizations:
    sdk: flutter
  google_sign_in: ^7.2.0
  image_picker: ^1.2.4
  flutter_image_compress: ^2.5.1
  permission_handler: ^13.0.2
  android_intent_plus: ^6.1.0
  image: ^4.12.0
  crypto: ^3.0.8
  url_launcher: ^6.3.3
  share_plus: ^13.3.1
  google_maps_flutter: ^2.19.0
  socket_io_client: ^3.1.6
  geolocator: ^14.0.1
  webview_flutter: ^4.14.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  in_app_purchase: ^3.3.1
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true  # framework widgets only; our own UI uses SVG icons (test enforces no Icons.*)
  assets:
    - assets/i18n/
    - assets/tz/
    - assets/geo/
    - assets/icons/
    - assets/brand/
    - assets/flags/1x1/
    - assets/flags/4x3/
  fonts:
    - family: Noto Sans
      fonts:
        - asset: assets/fonts/NotoSans-VF.ttf
    - family: Noto Sans Bengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-VF.ttf
    - family: Noto Sans Arabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-VF.ttf
    - family: Noto Nastaliq Urdu
      fonts:
        - asset: assets/fonts/NotoNastaliqUrdu-VF.ttf
    - family: Noto Sans Devanagari
      fonts:
        - asset: assets/fonts/NotoSansDevanagari-VF.ttf
